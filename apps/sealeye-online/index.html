<script src="console.js"></script>
<script>
  const state = JSON.parse(document.getElementById("state").textContent);
  const { el } = Console;

  Console.chrome(state, "Environments");

  const footer = document.getElementById("footer");
  const state_line = footer.textContent;
  footer.textContent = "";
  footer.appendChild(el("div", null,
    "Developers deploy to dev. The plan they approve is what the later stages are built from."));
  footer.appendChild(el("div", null, state_line));
  document.getElementById("pageTitle").textContent = state.page.title;
  document.getElementById("pageSub").textContent = state.page.subtitle;
  document.getElementById("primary").textContent = state.page.action;

  const stats = document.getElementById("stats");
  for (const stat of state.stats) {
    const box = el("div", "stat");
    box.appendChild(el("div", "n", stat.value));
    box.appendChild(el("div", "l", stat.label));
    stats.appendChild(box);
  }

  /** One group of the decision card, in the same words the terminal uses. */
  function group(heading, rows) {
    const box = el("div", "group");
    box.appendChild(el("h3", null, heading));

    for (const row of rows) {
      if (typeof row === "string") { box.appendChild(el("div", "plain", row)); continue; }

      const line = el("div", "row");
      line.appendChild(el("span", "id", row.id));

      const what = el("span", "what", row.line);
      if (row.planned) {
        what.appendChild(document.createTextNode(" "));
        what.appendChild(el("span", "tag", "(" + row.planned + ")"));
      }
      line.appendChild(what);
      box.appendChild(line);
    }

    return box;
  }

  function card(env) {
    const box = el("div", "cardbox");
    box.appendChild(group("Your app:", [env.card.app]));
    box.appendChild(group("We will provision this infrastructure to run it:", env.card.modules));
    if (env.card.patterns && env.card.patterns.length) {
      box.appendChild(group("Patterns the " + env.profile + " profile applies:", env.card.patterns));
    }
    box.appendChild(group("You will get back:", env.card.back));
    return box;
  }

  let openMenu = null;

  function closeMenu() {
    if (!openMenu) return;
    openMenu.menu.hidden = true;
    openMenu.button.setAttribute("aria-expanded", "false");
    openMenu = null;
  }

  document.addEventListener("click", closeMenu);
  document.addEventListener("scroll", closeMenu, true);
  window.addEventListener("resize", closeMenu);
  document.addEventListener("keydown", event => { if (event.key === "Escape") closeMenu(); });

  /**
   * One menu on a row: a heading so the developer knows which of the two they opened,
   * then its items. An item is { label, href } for a page of its own, { label, run }
   * for something this page does, { label } for a thing the console has but this
   * version does not do, and { label, disabled: true } when it cannot be done for
   * this row at all: a plan that was never built has no costs, logs or settings.
   */
  function kebab(env, heading, items) {
    const holder = el("span");

    const button = el("button", "kebab", "\u22EE");
    button.type = "button";
    button.setAttribute("aria-haspopup", "menu");
    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-label", heading + " for " + env.app);

    const menu = el("div", "menu");
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", heading + " for " + env.app);
    menu.hidden = true;
    // The menu carries the same words as its aria-label, so the visible heading is
    // decoration to a screen reader and says so.
    const title = el("h4", null, heading);
    title.setAttribute("aria-hidden", "true");
    menu.appendChild(title);

    let first = null;

    for (const spec of items) {
      let item;
      if (spec.href && !spec.disabled) {
        item = el("a", null, spec.label);
        item.href = spec.href;
        item.addEventListener("click", event => event.stopPropagation());
      } else {
        item = el("button", null, spec.label);
        item.type = "button";
        item.addEventListener("click", event => {
          event.stopPropagation();
          if (spec.disabled) return;
          closeMenu();
          if (spec.run) spec.run();
        });
      }
      item.setAttribute("role", "menuitem");
      if (spec.disabled) item.setAttribute("aria-disabled", "true");
      menu.appendChild(item);
      if (!first && !spec.disabled) first = item;
    }

    button.addEventListener("click", event => {
      event.stopPropagation();
      const wasOpen = openMenu && openMenu.menu === menu;
      closeMenu();
      if (wasOpen) return;

      const box = button.getBoundingClientRect();
      menu.hidden = false;
      menu.style.top = box.bottom + 6 + "px";
      menu.style.left = Math.max(8, box.right - menu.offsetWidth) + "px";
      button.setAttribute("aria-expanded", "true");
      openMenu = { menu, button };
      if (first) first.focus();
    });

    holder.appendChild(button);
    holder.appendChild(menu);

    return holder;
  }

  /**
   * The ticket seaLeye.run opened when it refused this plan. Every word of it comes
   * from the same fixture the CLI reads, so the console and the terminal cannot tell
   * the room two different stories about the same ticket.
   */
  function ticketPanel(env) {
    const context = state.teamContext;
    const ticket = context.ticket;
    const box = el("div", "cardbox");

    const head = el("div", "group tickethead");
    const line = el("div", "ticketline");
    line.appendChild(el("span", "mono id", ticket.id));
    line.appendChild(chip(ticket.status, ticket.status === "Open" ? "amber" : "neutral"));
    head.appendChild(line);
    head.appendChild(el("p", "subject", ticket.subject));
    box.appendChild(head);

    const body_ = el("div", "group");
    // The description arrives with its line breaks and keeps them: it is a ticket
    // body, and a ticket body reflowed into a paragraph stops being readable.
    body_.appendChild(el("pre", "ticketbody", ticket.description));
    box.appendChild(body_);

    const foot = el("div", "group");
    foot.appendChild(el("p", "notice", `Opened from ${context.priorAttempt.by}'s refused plan, ${context.priorAttempt.when}`));
    box.appendChild(foot);

    return box;
  }

  const chip = Console.chip;

  const body = document.getElementById("rows");
  const listed = [];

  for (const env of state.environments) {
    const row = el("tr", "env");
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-expanded", "false");

    row.appendChild(el("td", "mono app", env.app));

    const owner = el("td");
    const who = el("div", "owner");
    who.appendChild(el("span", "disc", env.owner.initial));
    who.appendChild(el("span", null, env.owner.name));
    owner.appendChild(who);
    row.appendChild(owner);

    const status = el("td");
    status.appendChild(el("span", "chip " + (env.chip || "neutral"), env.status));
    row.appendChild(status);

    // Where this app's plan has reached. Developers deploy to dev; the stages after it
    // are built from the same plan by the pipeline, so the strip reads left to right.
    const path = el("td", "path");
    const strip = el("div", "stages");
    for (const stage of state.stages) {
      const lit = (env.path || []).includes(stage);
      const mark = el("span", "chip stage " + (lit ? "phosphor" : "unlit"), stage);
      mark.title = lit ? stage + " has been built from this plan" : stage + " has not been built yet";
      strip.appendChild(mark);
    }
    path.appendChild(strip);
    row.appendChild(path);

    const url = el("td", "url");
    if (env.url) {
      const link = el("a", null, env.url);
      link.href = env.url;
      link.title = env.url;
      link.addEventListener("click", event => event.stopPropagation());
      url.appendChild(link);
    } else {
      const none = el("span", "none", env.note || "none");
      none.title = env.note || "none";
      url.appendChild(none);

      // A refusal that opened a ticket says so where the address would have been, and
      // the ticket opens in the row rather than in another tab.
      if (env.ticket) {
        url.appendChild(document.createTextNode("  \u00B7  "));
        const link = el("a", "mono ticket", env.ticket);
        link.href = "#";
        link.title = "Show the ticket seaLeye.run opened";
        link.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          showTicket(env);
        });
        url.appendChild(link);
      }
    }
    row.appendChild(url);

    row.appendChild(el("td", "mono", env.profile));
    row.appendChild(el("td", "mono", String(env.deploys)));
    row.appendChild(el("td", "mono last", env.last));

    const holder = el("tr", "card");
    holder.hidden = true;
    const cell = el("td");
    cell.colSpan = 10;
    holder.appendChild(cell);

    const toggle = (what) => {
      const wanted = what || "plan";
      // Clicking the row after opening a ticket shows the plan, and the other way
      // round, rather than closing something the reader did not mean to close.
      if (!holder.hidden && holder.dataset.showing === wanted) {
        holder.hidden = true;
        row.setAttribute("aria-expanded", "false");
        return;
      }
      cell.textContent = "";
      cell.appendChild(wanted === "ticket" ? ticketPanel(env) : card(env));
      holder.dataset.showing = wanted;
      holder.hidden = false;
      row.setAttribute("aria-expanded", "true");
    };

    const showTicket = () => toggle("ticket");

    // Only a live environment has pages behind these. A plan that was never built has
    // a plan to look at and nothing else, and the menu says so rather than hiding it.
    const live = env.status === "live";
    const page = name => name + ".html?app=" + encodeURIComponent(env.app) +
      (env.deploymentId ? "&env=" + env.deploymentId : "");
    // What is left of an environment once it is gone: what it cost, and its plan.
    const billed = live || env.status === "destroyed";

    const actions = el("td", "menucol");
    actions.appendChild(kebab(env, "Actions", [
      { label: "Plan", run: () => { if (holder.hidden) toggle(); } },
      { label: "Configure", href: page("configure"), disabled: !live },
      { label: "Control", href: page("control"), disabled: !live }
    ]));
    row.appendChild(actions);

    const info = el("td", "menucol");
    info.appendChild(kebab(env, "Info", [
      { label: "Costs", href: page("costs"), disabled: !billed },
      { label: "Logs", href: page("logs"), disabled: !live },
      { label: "Performance", href: page("performance"), disabled: !live }
    ]));
    row.appendChild(info);

    row.addEventListener("click", () => toggle("plan"));
    row.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle("plan"); }
    });

    body.appendChild(row);
    body.appendChild(holder);
    listed.push({ env, row, holder });
  }

  // Coming back from one of an environment's pages, the link names the app in the
  // hash; open its card so the reader lands where they left.
  const wanted = decodeURIComponent(location.hash.slice(1));
  const back = wanted && listed.find(item => item.env.app === wanted);
  if (back) {
    back.holder.hidden = false;
    back.row.setAttribute("aria-expanded", "true");
    back.row.scrollIntoView({ block: "center" });
  }

  // ---- finding things in a long list ----

  const search = document.getElementById("search");
  const toggles = {
    live: document.getElementById("toggleLive"),
    planned: document.getElementById("togglePlanned"),
    destroyed: document.getElementById("toggleDestroyed")
  };
  const profile = document.getElementById("profile");
  const count = document.getElementById("count");
  const empty = document.getElementById("empty");

  // The profiles the page actually has, in the order the catalog names them, so the
  // dropdown never offers a profile nothing is running.
  const PROFILE_ORDER = ["poc", "dev", "perf", "prod"];
  const present = [...new Set(state.environments.map(e => e.profile))]
    .sort((a, b) => PROFILE_ORDER.indexOf(a) - PROFILE_ORDER.indexOf(b));

  profile.appendChild(new Option("All profiles", ""));
  for (const id of present) profile.appendChild(new Option(id, id));

  function matches(env) {
    const term = search.value.trim().toLowerCase();
    if (term && !(env.app + " " + env.owner.name).toLowerCase().includes(term)) return false;

    const pressed = toggles[env.status];
    if (pressed && pressed.getAttribute("aria-pressed") === "false") return false;

    if (profile.value && env.profile !== profile.value) return false;

    return true;
  }

  function filter() {
    closeMenu();
    let shown = 0;

    for (const item of listed) {
      const keep = matches(item.env);
      item.row.hidden = !keep;
      if (!keep) {
        item.holder.hidden = true;
        item.row.setAttribute("aria-expanded", "false");
      }
      if (keep) shown += 1;
    }

    empty.hidden = shown > 0;
    count.innerHTML = "";
    count.appendChild(el("span", "n", String(shown)));
    count.appendChild(document.createTextNode(" of "));
    count.appendChild(el("span", "n", String(listed.length)));
  }

  search.addEventListener("input", filter);
  profile.addEventListener("change", filter);

  for (const toggle of Object.values(toggles)) {
    toggle.addEventListener("click", () => {
      toggle.setAttribute("aria-pressed", toggle.getAttribute("aria-pressed") === "true" ? "false" : "true");
      filter();
    });
  }

  filter();

</script>
</body>
</html>
