<style>
  /* seaLeye.online, the console. A delta from brand/BRAND.md, spelled out in
     brand/BRAND-ONLINE.md: the ground inverts, sans for reading, mono for data. */
  :root {
    --ground: #F4F6F8;
    --surface: #FFFFFF;
    --ink: #13181D;
    --dim: #5C6B7A;
    --rule: #DCE2E8;
    --phosphor: #1A7A64;
    --amber: #9A6418;
    --chip-phosphor-bg: #DDF3EC;
    --chip-amber-bg: #FBEFD6;
    --chip-neutral-bg: #E8ECF0;
    --sans: "IBM Plex Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", "IBM Plex Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
  }

  .mono { font-family: var(--mono); }

  /* ---- top bar ---- */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }
  .topbar .inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  /* 26 px cap height, not a 26 px image: in the SVG the capitals span 47 of the 160
     units, so the image renders at 88 and the frame crops the padding the drawing
     carries, which leaves the bar the height a console bar should be. */
  .wordmark { display: block; height: 44px; overflow: hidden; }
  .wordmark img { height: 88px; width: auto; display: block; margin-top: -22px; }

  nav { display: flex; gap: 22px; flex: 1 1 auto; }
  nav a {
    color: var(--dim);
    text-decoration: none;
    padding: 6px 0;
    border-bottom: 2px solid transparent;
  }
  nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--phosphor); }
  nav a:hover { color: var(--ink); }

  .who { display: flex; align-items: center; gap: 12px; color: var(--dim); }
  .disc {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--chip-phosphor-bg); color: var(--phosphor);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }

  /* ---- page ---- */
  main { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }

  .title { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
  .title h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .title .sub { color: var(--dim); margin: 4px 0 0; }
  .title .spacer { flex: 1 1 auto; }

  .primary {
    font: inherit;
    font-weight: 500;
    background: var(--phosphor);
    color: #FFFFFF;
    border: 1px solid var(--phosphor);
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
  }

  /* ---- stats ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px;
    margin: 28px 0 32px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .stat .n { font-family: var(--mono); font-size: 28px; line-height: 1.2; }
  .stat .l { color: var(--dim); font-size: 13px; }

  /* ---- table ---- */
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }

  /* Two rows fit on a screen. Two hundred will not, and the controls for that are
     worth having before the list needs them. */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 16px;
    border-bottom: 1px solid var(--rule);
  }
  .search {
    font: inherit;
    font-family: var(--mono);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 10px;
    flex: 0 1 260px;
    min-width: 160px;
  }
  .search::placeholder { color: var(--dim); font-family: var(--sans); }
  .search:focus, .profile:focus { outline: none; border-color: var(--phosphor); }

  .toggle {
    font: inherit;
    font-size: 13px;
    color: var(--dim);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 99px;
    padding: 5px 14px;
    cursor: pointer;
  }
  .toggle[aria-pressed="true"].live {
    background: var(--chip-phosphor-bg); color: var(--phosphor); border-color: var(--chip-phosphor-bg);
  }
  .toggle[aria-pressed="true"].planned {
    background: var(--chip-amber-bg); color: var(--amber); border-color: var(--chip-amber-bg);
  }

  .filterlabel { color: var(--dim); font-size: 13px; }
  .profile {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 6px 10px;
  }

  .count { margin-left: auto; color: var(--dim); font-size: 13px; }
  .count .n { font-family: var(--mono); }
  .empty { padding: 18px 16px; color: var(--dim); }
  .empty[hidden] { display: none; }
  table { width: 100%; border-collapse: collapse; }

  thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 12px 16px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  thead th.right { text-align: right; }

  tbody td { padding: 0 16px; height: 44px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tr.env { cursor: pointer; }
  tr.env:hover td { background: var(--ground); }
  tr.env:focus-visible { outline: 2px solid var(--phosphor); outline-offset: -2px; }

  .chip {
    display: inline-block;
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 99px;
    background: var(--chip-neutral-bg);
    color: var(--dim);
    white-space: nowrap;
  }
  .chip.phosphor { background: var(--chip-phosphor-bg); color: var(--phosphor); }
  .chip.amber { background: var(--chip-amber-bg); color: var(--amber); }

  .owner { display: flex; align-items: center; gap: 8px; }
  .owner .disc { width: 22px; height: 22px; font-size: 11px; background: var(--chip-neutral-bg); color: var(--dim); }

  td.url { max-width: 26ch; }
  td.url a, td.url span {
    font-family: var(--mono);
    color: var(--phosphor);
    display: block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  td.url span.none { color: var(--dim); }

  /* Each menu gets its own narrow column so its heading sits over its own dots
     rather than over the row's right edge. */
  th.menucol, td.menucol { width: 1%; white-space: nowrap; text-align: center; }

  .kebab {
    font: inherit;
    line-height: 1;
    color: var(--dim);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .kebab:hover, .kebab[aria-expanded="true"] { color: var(--ink); border-color: var(--rule); }

  /* Positioned against the viewport, because the panel clips its own corners and a
     menu on the last row would be cut in half by that. */
  .menu {
    position: fixed;
    z-index: 10;
    min-width: 140px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 4px;
    text-align: left;
  }
  .menu[hidden] { display: none; }
  .menu button {
    font: inherit;
    display: block;
    width: 100%;
    text-align: left;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 4px;
    padding: 7px 10px;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--ground); }
  .menu h4 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 4px 10px 6px;
  }

  tr.card td { padding: 0 16px 20px; background: var(--ground); }
  tr.card[hidden], tr.env[hidden] { display: none; }

  .cardbox { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
  .group { padding: 14px 18px; }
  .group + .group { border-top: 1px solid var(--rule); }
  .group h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--dim); margin: 0 0 8px; text-transform: none; }
  .row { display: flex; gap: 16px; padding: 3px 0; flex-wrap: wrap; }
  .row .id { font-family: var(--mono); min-width: 20ch; }
  .row .what { color: var(--dim); flex: 1 1 32ch; }
  .row .tag { color: var(--amber); }
  .plain { padding: 3px 0; }

  /* ---- catalog ---- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
  .modcard {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .modcard .body { flex: 1 1 auto; }
  .modcard .id { font-family: var(--mono); font-weight: 700; }
  .modcard .what { color: var(--dim); }

  h2 { font-size: 15px; font-weight: 600; margin: 36px 0 12px; }

  footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--dim); }

  @media (max-width: 720px) {
    th.menucol, td.menucol { display: none; }
    .topbar .inner { gap: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <span class="wordmark"><img src="sealeye-online-wordmark-light.svg" alt="seaLeye.online"></span>
    <nav id="nav"></nav>
    <div class="who"><span id="org"></span><span class="disc" id="userDisc"></span><span id="userName"></span></div>
  </div>
</div>

<main>

  <div class="title">
    <div>
      <h1 id="pageTitle"></h1>
      <p class="sub" id="pageSub"></p>
    </div>
    <div class="spacer"></div>
    <button type="button" class="primary" id="primary"></button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Search apps and owners"
             aria-label="Search apps and owners" spellcheck="false" autocomplete="off">
      <button type="button" class="toggle live" id="toggleLive" aria-pressed="true">Live</button>
      <button type="button" class="toggle planned" id="togglePlanned" aria-pressed="true">Planned</button>
      <label class="filterlabel" for="profile">Profile</label>
      <select id="profile" class="profile"></select>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>App</th><th>Owner</th><th>Status</th><th>URL</th><th>Profile</th>
          <th>Deploys</th><th>Last</th><th class="menucol">Actions</th><th class="menucol">Info</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No environments match what you are looking for.</div>
  </div>

  <h2>Catalog</h2>
  <div class="cards" id="catalog"></div>

  <footer id="footer"></footer>

</main>

<script>
  const state = JSON.parse(document.getElementById("state").textContent);

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  document.getElementById("org").textContent = state.org;
  document.getElementById("userDisc").textContent = state.user.initial;
  document.getElementById("userName").textContent = state.user.name;
  document.getElementById("pageTitle").textContent = state.page.title;
  document.getElementById("pageSub").textContent = state.page.subtitle;
  document.getElementById("primary").textContent = state.page.action;

  document.getElementById("footer").textContent =
    "State shown here is read from your environments, not from anyone's laptop.";

  const nav = document.getElementById("nav");
  for (const item of state.nav) {
    const link = el("a", null, item.label);
    link.href = "#";
    if (item.current) link.setAttribute("aria-current", "page");
    link.addEventListener("click", event => event.preventDefault());
    nav.appendChild(link);
  }

  const stats = document.getElementById("stats");
  for (const stat of state.stats) {
    const box = el("div", "stat");
    box.appendChild(el("div", "n", stat.value));
    box.appendChild(el("div", "l", stat.label));
    stats.appendChild(box);
  }

  /** One group of the decision card, in the same words the terminal uses. */
  function group(heading, rows) {
    const box = el("div", "group");
    box.appendChild(el("h3", null, heading));

    for (const row of rows) {
      if (typeof row === "string") { box.appendChild(el("div", "plain", row)); continue; }

      const line = el("div", "row");
      line.appendChild(el("span", "id", row.id));

      const what = el("span", "what", row.line);
      if (row.planned) {
        what.appendChild(document.createTextNode(" "));
        what.appendChild(el("span", "tag", "(" + row.planned + ")"));
      }
      line.appendChild(what);
      box.appendChild(line);
    }

    return box;
  }

  function card(env) {
    const box = el("div", "cardbox");
    box.appendChild(group("Your app:", [env.card.app]));
    box.appendChild(group("We will provision this infrastructure to run it:", env.card.modules));
    if (env.card.patterns && env.card.patterns.length) {
      box.appendChild(group("Patterns the " + env.profile + " profile applies:", env.card.patterns));
    }
    box.appendChild(group("You will get back:", env.card.back));
    return box;
  }

  let openMenu = null;

  function closeMenu() {
    if (!openMenu) return;
    openMenu.menu.hidden = true;
    openMenu.button.setAttribute("aria-expanded", "false");
    openMenu = null;
  }

  document.addEventListener("click", closeMenu);
  document.addEventListener("scroll", closeMenu, true);
  window.addEventListener("resize", closeMenu);
  document.addEventListener("keydown", event => { if (event.key === "Escape") closeMenu(); });

  /**
   * One menu on a row: a heading so the developer knows which of the two they opened,
   * then its items. Every item is inert in this version; the shape is the point.
   */
  function kebab(env, heading, items) {
    const holder = el("span");

    const button = el("button", "kebab", "\u22EE");
    button.type = "button";
    button.setAttribute("aria-haspopup", "menu");
    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-label", heading + " for " + env.app);

    const menu = el("div", "menu");
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", heading + " for " + env.app);
    menu.hidden = true;
    // The menu carries the same words as its aria-label, so the visible heading is
    // decoration to a screen reader and says so.
    const title = el("h4", null, heading);
    title.setAttribute("aria-hidden", "true");
    menu.appendChild(title);

    let first = null;

    for (const label of items) {
      const item = el("button", null, label);
      item.type = "button";
      item.setAttribute("role", "menuitem");
      item.addEventListener("click", event => { event.stopPropagation(); closeMenu(); });
      menu.appendChild(item);
      if (!first) first = item;
    }

    button.addEventListener("click", event => {
      event.stopPropagation();
      const wasOpen = openMenu && openMenu.menu === menu;
      closeMenu();
      if (wasOpen) return;

      const box = button.getBoundingClientRect();
      menu.hidden = false;
      menu.style.top = box.bottom + 6 + "px";
      menu.style.left = Math.max(8, box.right - menu.offsetWidth) + "px";
      button.setAttribute("aria-expanded", "true");
      openMenu = { menu, button };
      if (first) first.focus();
    });

    holder.appendChild(button);
    holder.appendChild(menu);

    return holder;
  }

  const body = document.getElementById("rows");
  const listed = [];

  for (const env of state.environments) {
    const row = el("tr", "env");
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-expanded", "false");

    row.appendChild(el("td", "mono", env.app));

    const owner = el("td");
    const who = el("div", "owner");
    who.appendChild(el("span", "disc", env.owner.initial));
    who.appendChild(el("span", null, env.owner.name));
    owner.appendChild(who);
    row.appendChild(owner);

    const status = el("td");
    status.appendChild(el("span", "chip " + (env.chip || "neutral"), env.status));
    row.appendChild(status);

    const url = el("td", "url");
    if (env.url) {
      const link = el("a", null, env.url);
      link.href = env.url;
      link.title = env.url;
      link.addEventListener("click", event => event.stopPropagation());
      url.appendChild(link);
    } else {
      const none = el("span", "none", env.note || "none");
      none.title = env.note || "none";
      url.appendChild(none);
    }
    row.appendChild(url);

    row.appendChild(el("td", "mono", env.profile));
    row.appendChild(el("td", "mono", String(env.deploys)));
    row.appendChild(el("td", "mono", env.last));

    const actions = el("td", "menucol");
    actions.appendChild(kebab(env, "Actions", ["Plan", "Configure", "Destroy"]));
    row.appendChild(actions);

    const info = el("td", "menucol");
    info.appendChild(kebab(env, "Info", ["Costs", "Logs", "Performance"]));
    row.appendChild(info);

    const holder = el("tr", "card");
    holder.hidden = true;
    const cell = el("td");
    cell.colSpan = 9;
    cell.appendChild(card(env));
    holder.appendChild(cell);

    const toggle = () => {
      holder.hidden = !holder.hidden;
      row.setAttribute("aria-expanded", holder.hidden ? "false" : "true");
    };

    row.addEventListener("click", toggle);
    row.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle(); }
    });

    body.appendChild(row);
    body.appendChild(holder);
    listed.push({ env, row, holder });
  }

  // ---- finding things in a long list ----

  const search = document.getElementById("search");
  const toggles = { live: document.getElementById("toggleLive"), planned: document.getElementById("togglePlanned") };
  const profile = document.getElementById("profile");
  const count = document.getElementById("count");
  const empty = document.getElementById("empty");

  // The profiles the page actually has, in the order the catalog names them, so the
  // dropdown never offers a profile nothing is running.
  const PROFILE_ORDER = ["poc", "dev", "perf", "prod"];
  const present = [...new Set(state.environments.map(e => e.profile))]
    .sort((a, b) => PROFILE_ORDER.indexOf(a) - PROFILE_ORDER.indexOf(b));

  profile.appendChild(new Option("All profiles", ""));
  for (const id of present) profile.appendChild(new Option(id, id));

  function matches(env) {
    const term = search.value.trim().toLowerCase();
    if (term && !(env.app + " " + env.owner.name).toLowerCase().includes(term)) return false;

    const pressed = toggles[env.status];
    if (pressed && pressed.getAttribute("aria-pressed") === "false") return false;

    if (profile.value && env.profile !== profile.value) return false;

    return true;
  }

  function filter() {
    closeMenu();
    let shown = 0;

    for (const item of listed) {
      const keep = matches(item.env);
      item.row.hidden = !keep;
      if (!keep) {
        item.holder.hidden = true;
        item.row.setAttribute("aria-expanded", "false");
      }
      if (keep) shown += 1;
    }

    empty.hidden = shown > 0;
    count.innerHTML = "";
    count.appendChild(el("span", "n", String(shown)));
    count.appendChild(document.createTextNode(" of "));
    count.appendChild(el("span", "n", String(listed.length)));
  }

  search.addEventListener("input", filter);
  profile.addEventListener("change", filter);

  for (const toggle of Object.values(toggles)) {
    toggle.addEventListener("click", () => {
      toggle.setAttribute("aria-pressed", toggle.getAttribute("aria-pressed") === "true" ? "false" : "true");
      filter();
    });
  }

  filter();

  const catalog = document.getElementById("catalog");
  for (const module of state.catalog) {
    const box = el("div", "modcard");
    const body_ = el("div", "body");
    body_.appendChild(el("div", "id", module.id));
    body_.appendChild(el("div", "what", module.line));
    box.appendChild(body_);
    // Available is good news, planned is agreed and waiting, requested is waiting on a
    // person. Phosphor, amber, neutral, which is the whole palette and no more of it.
    const tone = { available: "phosphor", planned: "amber", requested: "neutral" };
    box.appendChild(el("span", "chip " + (tone[module.state] || "neutral"),
      module.state.charAt(0).toUpperCase() + module.state.slice(1)));
    catalog.appendChild(box);
  }
</script>
</body>
</html>
