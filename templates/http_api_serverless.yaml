AWSTemplateFormatVersion: "2010-09-09"
Description: deployme http_api_serverless - Lambda + HTTP API + logs, app runs unchanged via Lambda Web Adapter
Parameters:
  AppName:
    Type: String
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  RetentionDays:
    Type: Number
    Default: 30
  AdapterLayerVersion:
    Type: Number
  # One parameter per setting the plan asks for is written in below, each NoEcho, so the
  # values never reach this file on disk, the stack events or the console. The template
  # deploys unchanged when the plan asks for none.
  # sealeye:config-parameters
Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}"
      RetentionInDays: !Ref RetentionDays
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref AppName
      Runtime: nodejs20.x
      Handler: run.sh
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      MemorySize: 512
      Timeout: 30
      Architectures:
        - x86_64
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:${AdapterLayerVersion}"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
          # Each setting the plan asks for is written in below, pointing at its own
          # parameter. PORT is the platform's and is never one of them.
          # sealeye:config-variables
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref AppName
      ProtocolType: HTTP
      Target: !GetAtt Function.Arn
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"
Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionName:
    Value: !Ref Function
  LogGroup:
    Value: !Ref LogGroup
