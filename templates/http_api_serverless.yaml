AWSTemplateFormatVersion: "2010-09-09"
Description: seaLeye http_api_serverless - Lambda + HTTP API + logs, app runs unchanged via Lambda Web Adapter
Parameters:
  AppName:
    Type: String
    Description: The name everything here is called after, the environment's name (core/names.js)
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  RetentionDays:
    Type: Number
    Default: 30
  AdapterLayerVersion:
    Type: Number
  # The most any function seaLeye builds may do, whatever its role says: write its logs
  # and read app settings (deploy/deploy-role.yaml, FunctionBoundary). The deploy role can
  # make a function role only with this boundary on it.
  FunctionBoundaryArn:
    Type: String
  # The app's folder in the organization's store, /sealeye-apps/<team>/<app>, when it has
  # settings there; empty when it has none (PHASE2-PLAN Step 10).
  SettingsFolder:
    Type: String
    Default: ""
    AllowedPattern: "^(/sealeye-apps/[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*)?$"
  # The deployment this is (dep_...). Every deploy changes it, so every deploy is a real
  # change that restarts the function, even one that sends the same code again with the
  # same parameters (DESIGN.md, "Deploying again"): the app then reads its settings anew,
  # and the stack's status is this deployment's, never a leftover.
  DeploymentId:
    Type: String
    Default: ""
    AllowedPattern: "^(dep_[a-z0-9]+)?$"
  # One parameter per setting the plan asks for is written in below, each NoEcho, so the
  # values never reach this file on disk, the stack events or the console. The template
  # deploys unchanged when the plan asks for none.
  # sealeye:config-parameters
Conditions:
  HasSettings: !Not [!Equals [!Ref SettingsFolder, ""]]
Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}"
      RetentionInDays: !Ref RetentionDays
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !Ref FunctionBoundaryArn
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Its own folder of settings, and no other app's.
      Policies: !If
        - HasSettings
        - - PolicyName: own-settings
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ssm:GetParametersByPath
                  Resource:
                    - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SettingsFolder}"
                    - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SettingsFolder}/*"
        - !Ref AWS::NoValue
  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref AppName
      Runtime: nodejs20.x
      Handler: run.sh
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      MemorySize: 512
      Timeout: 30
      Architectures:
        - x86_64
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:${AdapterLayerVersion}"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
          SEALEYE_DEPLOYMENT_ID: !Ref DeploymentId
          # Where the settings reader in run.sh finds the app's settings; absent when
          # the app has none in the store.
          SEALEYE_SETTINGS_PATH: !If [HasSettings, !Sub "${SettingsFolder}/", !Ref AWS::NoValue]
          # Each setting the plan asks for is written in below, pointing at its own
          # parameter. PORT is the platform's and is never one of them.
          # sealeye:config-variables
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref AppName
      ProtocolType: HTTP
      Target: !GetAtt Function.Arn
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"
Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionName:
    Value: !Ref Function
  LogGroup:
    Value: !Ref LogGroup
