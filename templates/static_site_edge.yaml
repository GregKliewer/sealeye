AWSTemplateFormatVersion: "2010-09-09"
Description: seaLeye static_site_edge - S3 website hosting (CloudFront deliberately omitted)
Parameters:
  AppName:
    Type: String
    Description: The name everything here is called after, the environment's name (core/names.js)
  # Cost allocation tags (PHASE2-PLAN Step 20): which app and which team this is, so
  # costs can be read by app once the tags are activated for billing.
  TagApp:
    Type: String
    Default: ""
  TagTeam:
    Type: String
    Default: ""
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: sealeye:app
          Value: !Ref TagApp
        - Key: sealeye:team
          Value: !Ref TagTeam
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
Outputs:
  WebsiteUrl:
    Value: !GetAtt Bucket.WebsiteURL
  BucketName:
    Value: !Ref Bucket
