planVersion: 0.3
# 0.3 extends 0.2. Every 0.2 plan is a valid 0.3 plan: the version, the two older
# profile names and the five original modules are all still accepted.

# -------------------------------
# Application Metadata
# -------------------------------
app:
  name: your-app-name
  type: static-site | api
  # High-level classification used by the platform to guide module selection

# -------------------------------
# Deployment Profile
# -------------------------------
profile: poc | dev | perf | prod
# Chooses the patterns the modules are built with, not a size. The patterns live in
# prompts/module-catalog.yaml, and capacity is set by a load test.
# - poc:  trying something out, nothing kept warm
# - dev:  a team using it every day, backups kept, failed work held onto
# - perf: provisioned from the prod plan, on a network of its own, so it can be measured
# - prod: data across more than one zone, warm capacity, a queue in front of bursts,
#         alarms on errors and latency
#
# team and prodish were the 0.2 names. A plan that still says so is read as dev and
# prod, and nothing else about the plan changes.

# -------------------------------
# Selected Platform Modules
# -------------------------------
modules:

  # ---------------------------
  # STATIC SITE EDGE
  # ---------------------------
  - id: static_site_edge
    enabled: false   # set to true if deploying a static frontend
    inputs:
      site_root: .
      entry_point: index.html
      additional_pages: []
      assets_path: images/
    # Purpose:
    # - Hosts static files (HTML, CSS, images)
    # - Distributes globally via edge caching
    # - Provides fast load times worldwide
    #
    # Typical usage:
    # - Static websites
    # - Frontend apps without backend logic

  # ---------------------------
  # HTTP API SERVERLESS
  # ---------------------------
  - id: http_api_serverless
    enabled: false   # set to true for backend/API apps
    inputs:
      runtime: nodejs | python
      entry_point: index.js
      trigger: http
    # Purpose:
    # - Runs backend logic on-demand
    # - Exposes application via HTTPS endpoint
    # - Scales automatically with traffic
    #
    # Typical usage:
    # - REST APIs
    # - lightweight backend services
    # - webhook handlers

  # ---------------------------
  # OBSERVABILITY (SHARED)
  # ---------------------------
  - id: observability_basic
    enabled: true
    inputs:
      target: auto     # automatically attaches to core module
      metrics: [requests, errors, latency]
      retention_days: 30
    # Purpose:
    # - Captures logs (stdout, errors)
    # - Tracks traffic and performance metrics
    #
    # Applies to:
    # - ALL applications (static + API)
    #
    # Why it exists:
    # - Gives developers visibility without needing platform tools

  # ---------------------------
  # CONFIGURATION (ENV VARS)
  # ---------------------------
  - id: config_basic
    enabled: false
    inputs:
      variables: {}
    # Purpose:
    # - Injects environment variables into the application at runtime
    # - Keeps secrets/config out of code
    #
    # Typical usage:
    # - API keys
    # - database URLs
    # - feature flags
    #
    # Usually:
    # - enabled for APIs
    # - skipped for static sites

  # ---------------------------
  # PUBLIC DOMAIN (OPTIONAL)
  # ---------------------------
  - id: domain_public
    enabled: false
    inputs:
      domain_name: null
    # Purpose:
    # - Associates a custom domain (e.g. mysite.com)
    #
    # Behavior:
    # - If disabled → platform generates URL automatically
    #
    # Notes:
    # - Optional for both static and API apps

  # ---------------------------
  # PLANNED MODULES
  # ---------------------------
  # In the library, not yet deployable. The interview may select any of these and the
  # plan records them exactly like the others. The platform refuses to deploy a plan
  # that enables one, names which, and says the plan is valid and saved. It does not
  # deploy something smaller and call it done.
  #
  # Their descriptions, when to choose them and what their inputs mean are in
  # prompts/module-catalog.yaml, where availability says whether a module is
  # available, planned or requested.

  - id: data_relational          # a managed relational database your app connects to
    enabled: false
    inputs:
      engine: postgres | mysql
      database_name: app
      connection_setting: DATABASE_URL

  - id: data_cache               # a fast in-memory cache
    enabled: false
    inputs:
      connection_setting: CACHE_URL
      purpose: lookups | sessions | rendered pages

  - id: events_stream            # a stream your services publish to and read from
    enabled: false
    inputs:
      stream_name: events
      readers: []

  - id: queue_basic              # a work queue between services
    enabled: false
    inputs:
      queue_name: work
      handled_by: worker
      keep_failed_work: true

  - id: secrets_basic            # secrets your app reads at runtime, never in code
    enabled: false
    inputs:
      names: []
      rotation: manual | scheduled

  - id: identity_service         # sign-in and tokens for your app's users
    enabled: false
    inputs:
      sign_in_with: [email]
      token_audience: your-app

  - id: network_private          # your app is not reachable from the public internet
    enabled: false
    inputs:
      reachable_from: [internal]
      public_path: closed | open

  - id: compute_container        # a service that runs continuously rather than on demand
    enabled: false
    inputs:
      start_command: npm start
      health_path: /health

  - id: scheduled_job            # something that runs on a schedule
    enabled: false
    inputs:
      runs: hourly | nightly | weekly
      command: node job.js

  - id: storage_object           # files your app stores and reads, not a served site
    enabled: false
    inputs:
      store_name: files
      readable_by: your app only | anyone with the link

# -------------------------------
# Expected Outputs
# -------------------------------
outputs:
  - public_url
  - logs
  - metrics
# What the developer will receive after deployment
# (abstracts away backend/platform details)

# -------------------------------
# Execution Metadata (POC2+)
# -------------------------------
execution:
  strategy: pipeline | direct
  # pipeline → CI/CD execution (e.g., GitHub Actions)
  # direct → immediate execution (CLI / API calls)