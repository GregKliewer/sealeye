# seaLeye.run module catalog, planVersion 0.4.
#
# One source of truth for the modules: the interview system prompt
# (prompts/interview-system.md) describes these in prose, the CLI reads this file for
# the lines it prints and for the defaults it fills in. Keep every "line" free of em
# dashes and vendor terms, because the developer sees them. No sizes, counts or
# capacity numbers anywhere in this file: profiles choose patterns, and capacity is set
# by a load test.
#
# Every module in this file is one seaLeye.run builds today. There is no other kind.
# seaLeye.run does not know what is in an organization's Platform Library until it has
# ingested it, so it cannot honestly call anything planned or requested, and it never
# names a module it cannot build.
#
# What an app needs beyond these four is a NEED, not a module. need_kinds below is the
# fixed list of them, so the same need is described the same way in every run. A need
# has no id the developer ever sees: it is a sentence about the app, and the evidence
# is the code that shows it.
#
# short_line is the same module in a few words, for places where a list has to be read
# at a glance. "line" is the sentence the card and the plan file use.
#
# Every "when", every module signal and every need signal describes code or
# configuration, never prose. A README says what an app is for, and what an app is for
# is not a thing the platform can deploy. Selecting a module, or recording a need,
# because a sentence mentioned the idea of it is how a plan ends up with
# infrastructure nobody's code asked for.

catalogVersion: "0.4"
modules:
  - id: static_site_edge
    availability: available
    role: core
    line: >-
      Serves your HTML, CSS, images and other files straight to visitors over HTTPS.
    when: >-
      The app has no server: files a browser opens directly, or the built output of a
      front end with nothing running behind it.
    skip_line: >-
      Your app serves requests, so it needs to run, not just be served.
    signals:
      - index.html at the root
      - no server file and no listen call
      - no web framework in dependencies
    app_type: static-site
    inputs:
      site_root:
        default: "."
        line: Where your files live in the folder.
        # The executor syncs the app folder root; site_root is recorded in the plan.
      entry_point:
        default: index.html
        line: The page visitors land on.
      additional_pages:
        default: []
        line: Other pages in the site.
      assets_path:
        default: images/
        line: Where your images and other assets live.

  - id: http_api_serverless
    availability: available
    role: core
    line: >-
      Runs your code on demand behind an HTTPS endpoint. It starts when a request
      arrives and costs nothing while nothing is calling it.
    when: >-
      Anything in the app listens for HTTP: an Express, Fastify or Koa server, a bare
      http.createServer, a REST API, a webhook receiver, a small service.
    skip_line: >-
      Your app does not answer HTTP requests on demand.
    signals:
      - a listen call
      - a start script that runs a server
      - a web framework in dependencies
    app_type: api
    inputs:
      runtime:
        default: nodejs
        enum: [nodejs]
        line: The language your app runs in.
        # The contract allows python; this version deploys nodejs only.
      entry_point:
        default: index.js
        line: The file that starts your app.
        # From package.json main, or the file the start script runs.
      trigger:
        default: http
        enum: [http]
        line: What causes your app to run.

  - id: observability_basic
    availability: available
    role: shared
    always_enabled: true
    line: >-
      Collects your app's logs and tracks requests, errors and response times, so you
      can see what your app is doing without setting anything up.
    when: >-
      Every app, static or HTTP. Never optional, so never ask about it.
    skip_line: >-
      Never skipped.
    inputs:
      target:
        default: auto
        line: Attaches itself to however your app runs.
      metrics:
        default: [requests, errors, latency]
        line: What gets tracked.
      retention_days:
        default: 30
        line: How long logs are kept.
        # compose.js maps this to the RetentionDays stack parameter.

  - id: config_basic
    availability: available
    role: optional
    line: >-
      Passes the settings your app reads from its environment through to it when it
      runs, so they stay out of your code.
    when: >-
      Only if the app actually reads environment variables. Look for process.env, a
      .env.example, or settings listed in the README. If none, include the module with
      enabled false so the plan records that it was considered.
    skip_line: >-
      Your app does not read any settings from its environment.
    signals:
      - process.env in the source
      - a .env.example or .env.sample file
      - settings documented in the README
    inputs:
      variables:
        default: {}
        line: The settings your app needs, by name.
        # Names only. Values are supplied at deploy time, never written into the plan.
        # compose.js passes each name to the function, values from the folder's .env
        # when there is one and from the plan otherwise. PORT is never one of them.


# ---------------------------------------------------------------------------
# Need kinds
# ---------------------------------------------------------------------------
# What an app can need that no module here supports. The key is internal and is never
# printed; "line" is what the developer reads, on the card, in the refusal and in the
# plan file. profile_expects is what the profile will ask of this need once something
# supports it, in the same words the patterns use and with no number among them.
#
# This list is fixed so that the same need is described the same way in every run. A
# need is a sentence about the app, never an id, and never a module in disguise.

need_kinds:
  - key: continuous_service
    line: a service that runs continuously
    signals:
      - a loop that consumes rather than a request handler
      - a long lived client opened at startup and kept open
      - a health endpoint reporting whether it is still consuming
      - a start command that is not a request server
    profile_expects:
      dev: Runs continuously in a single zone, replaced when it stops being well.
      prod: Across more than one zone, behind a health check, replaced rather than repaired.

  - key: relational_database
    line: a relational database
    signals:
      - a database client among the dependencies
      - a connection setting such as DATABASE_URL
      - SQL in the code, or a migrations folder
    profile_expects:
      dev: A single zone, with backups kept and restorable.
      prod: Across more than one zone, with a standby ready to take over and backups kept.

  - key: event_stream
    line: a stream of events it publishes or reads
    signals:
      - a stream or broker client among the dependencies
      - a setting naming brokers or a topic
      - a consumer loop, or a publish call
    profile_expects:
      prod: Readers keep their place, so a reader that falls behind catches up instead of losing events.

  - key: runtime_secrets
    line: secrets it reads while it runs
    signals:
      - a setting whose name says key, token, secret or password
      - a signing or credential value read from the environment
    profile_expects:
      prod: Replaced on a schedule, and read while the app runs rather than baked into anything.

  - key: internal_only
    line: to be reachable from inside your organization only
    signals:
      - configuration binding it to an internal address or network
      - a setting naming an internal host it must sit behind
    profile_expects:
      perf: A network of its own, so a load test cannot reach anything that people depend on.
      prod: Reachable from your organization only, with the public way in closed.

  - key: custom_domain
    line: a custom domain you already own
    signals:
      - a domain the code or the configuration is pinned to
      - a certificate or host setting naming a domain

  - key: work_queue
    line: a queue between it and the work it hands off
    signals:
      - a queue client among the dependencies
      - a setting naming a queue
      - a worker that reads work rather than serving requests
    profile_expects:
      dev: Work that fails repeatedly is kept rather than dropped.
      prod: A queue in front of anything that bursts, with failed work kept and alarmed on.

  - key: user_sign_in
    line: sign-in and tokens for its own users
    signals:
      - an authentication library among the dependencies
      - a token or session setting read at startup
      - a sign-in or callback route
    profile_expects:
      prod: Short lived tokens, checked on every request.

  - key: scheduled_task
    line: something that runs on a schedule
    signals:
      - a scheduler among the dependencies
      - a job entry point separate from the request handler
      - a setting naming a schedule
    profile_expects:
      dev: Runs on its schedule, and a run that fails is visible rather than silent.
      prod: Runs where it can be watched, and a run that fails raises an alarm.

  - key: file_storage
    line: somewhere to keep files it stores and reads back
    signals:
      - an upload route
      - a storage client among the dependencies
      - a setting naming a bucket or a folder for files
    profile_expects:
      prod: Copies kept across more than one zone, and earlier versions kept.

  - key: cache
    line: a cache in front of something slower
    signals:
      - a cache client among the dependencies
      - a setting naming a cache endpoint, or a maximum age
    profile_expects:
      dev: A single zone, and the app keeps working when the cache is empty.
      prod: Across more than one zone, and the app keeps serving when the cache is cold.

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
# A profile is not a size. It chooses the patterns the modules are built with, and the
# patterns are in the section below. Capacity is set by a load test, always.
#
# A profile is never a reason to refuse. Whatever a plan is designed for, this run
# builds a dev environment; the patterns are what the pipeline applies to the
# environments it builds later, and they are recorded in the plan for it.

profiles:
  - id: poc
    line: >-
      Trying something out. Cheap to run, quick to throw away, nothing kept warm.
  - id: dev
    line: >-
      A team using it every day. The same shape as a proof of concept, with backups
      kept and work that fails held onto.
  - id: perf
    line: >-
      Built to be measured. Provisioned from the production plan, on a network of its
      own, so a load test can say what the capacity is.
  - id: prod
    line: >-
      People depend on it. Data across more than one zone, capacity warm on the request
      path, a queue in front of anything that bursts, alarms on errors and latency.

# planVersion 0.2 named two of these differently. A plan that still says so is read as
# the profile that replaced it, and nothing else about the plan changes.
legacy_profiles:
  team: dev
  prodish: prod

# ---------------------------------------------------------------------------
# Patterns
# ---------------------------------------------------------------------------
# What each profile asks of each module it builds, in the developer's language. Only
# modules appear here. What a profile will expect of a need is on the need itself, in
# need_kinds above, because a need has no module to hang a pattern on.

patterns:
  poc:
    line: >-
      A single zone, started on demand, nothing kept warm, and nothing to pay for while
      nothing is calling it. This is what the platform deploys today.
    modules:
      http_api_serverless: >-
        Starts when a request arrives and costs nothing while nothing is calling it.
      static_site_edge: >-
        Files served straight to visitors over HTTPS.
      observability_basic: >-
        Logs and basic metrics, kept for as long as the plan asks.
      config_basic: >-
        Settings handed to the app as it starts.

  dev:
    line: >-
      A single zone and on demand, like a proof of concept, but nothing is thrown away:
      data is backed up and failed work is kept.
    modules:
      observability_basic: >-
        Logs and basic metrics kept, so a run that fails is visible rather than silent.

  perf:
    line: >-
      Provisioned from the production plan: the same modules, the same patterns, on a
      separate network. Nothing here is guessed, and the numbers come from the load
      test rather than from this file.
    modules:
      observability_basic: >-
        The same alarms as production, so a load test is measured the way the real
        thing is watched.

  prod:
    line: >-
      Data across more than one zone, capacity warm on the request path, a queue in
      front of anything that bursts, and alarms on errors and latency. Capacity is set
      by a load test.
    modules:
      http_api_serverless: >-
        Warm capacity on the request path, so the first request after a quiet spell is
        not the slow one.
      static_site_edge: >-
        Served from storage that keeps copies across more than one zone.
      observability_basic: >-
        Alarms on errors and latency, going to whoever is on call.
      config_basic: >-
        Settings from the environment, and anything secret kept out of the plan.

# Exactly one core module is enabled per plan: one app, one way of running it.
rules:
  core_modules: [static_site_edge, http_api_serverless]
  exactly_one_core: true
  always_enabled: [observability_basic]
  # Every module in this file is deployable. Anything else an app needs is a need, and
  # a plan carrying needs is a draft the platform declines to deploy, saying which.
  deployable: [static_site_edge, http_api_serverless, observability_basic, config_basic]

defaults:
  profile: poc            # poc | dev | perf | prod
  outputs: [public_url, logs, metrics]
