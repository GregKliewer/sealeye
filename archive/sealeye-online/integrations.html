<title>Integrations, seaLeye.online</title>

<!-- Everything this page shows. Edit here; nothing else holds state. This page is a
     report, not a picker: it answers what is wired in at Northline Bank today and what
     that means for a developer. Connecting or changing an integration is a Site Admin
     action and happens in the admin area, so there is nothing to press here.
     `catalog_of_providers` is every vendor the admin area offers per job. This page does
     not render it; it is kept so the lists survive for that screen. -->
<script type="application/json" id="state">
{
  "org": "Northline Bank",
  "user": { "name": "Greg K.", "initial": "G" },
  "page": {
    "title": "Integrations",
    "subtitle": "What seaLeye reads from, writes to and hands off to at Northline Bank."
  },
  "notice": "Signed in as Greg K., Money Movement. Connecting or changing an integration is a Site Admin action. Request sends a note to yours.",

    {
      "job": "Infrastructure as code",
      "connected": true,
      "inPlace": [
        { "name": "AWS CloudFormation", "says": "seaLeye composes the template and CloudFormation builds it.", "data": "ca-central-1  ·  one stack per environment, named sealeye-<app>" }
      ],
      "note": "Your platform library is not connected, so seaLeye.run builds only from its five base modules."
    },
    {
      "job": "CI/CD",
      "connected": false,
      "inPlace": [],
      "nothing": "Developers deploy to a dev environment only. Promotion to SIT and beyond is not connected yet."
    }
  ],
  "groups": [
    {
      "job": "Sign people in",
      "why": "So sealeye knows who is running it, and seaLeye.online shows each team only its own environments. Your team mapping comes from here.",
      "providers": [
        { "name": "Azure AD", "connected": true, "detail": "northline.onmicrosoft.com  ·  3 teams mapped, including Money Movement" },
        { "name": "Okta" },
        { "name": "Ping Identity" }
      ]
    },
    {
      "job": "Turn refusals into backlog",
      "why": "So every 'not in the catalog' becomes a ticket for your platform team, with the module, the app and the team that asked. The platform backlog writes itself.",
      "providers": [
        { "name": "Atlassian Jira", "connected": true, "detail": "northline.atlassian.net  ·  project PLAT  ·  5 tickets opened from refusals this month" },
        { "name": "Azure Boards" },
        { "name": "Linear" },
        { "name": "GitHub Issues" }
      ]
    },
    {
      "job": "Read your Platform Library",
      "why": "So seaLeye can read your modules and pipelines, generate a plan interface for each one, and teach the assistant what to ask about them. Until this is connected, the catalog is the five seaLeye base modules.",
      "note": "1 environment is waiting on 5 needs no module supports yet.",
      "providers": [
        { "name": "GitHub Enterprise" },
        { "name": "GitLab" },
        { "name": "Bitbucket" },
        { "name": "Azure DevOps" }
      ]
    },
    {
      "job": "Check plans against your policies",
      "why": "So every plan is checked against your guardrails before anything is built, and a plan that would fail is refused with the rule named.",
      "providers": [
        { "name": "Open Policy Agent" },
        { "name": "HashiCorp Sentinel" },
        { "name": "AWS Config" },
        { "name": "Wiz" }
      ]
    },
    {
      "job": "Keep secrets out of plans",
      "why": "So an app that reads secrets while it runs reads them from the vault your security team already runs, and no value is ever written into a plan, a report or a repo.",
      "providers": [
        { "name": "HashiCorp Vault" },
        { "name": "CyberArk" },
        { "name": "AWS Secrets Manager" },
        { "name": "Azure Key Vault" }

      "why": "So each team's environments land in that team's own account, with that account's guardrails. Today every dev environment lands in one shared account.",
      "providers": [

        { "name": "Azure Landing Zones" },

    {

        { "name": "Checkmarx" },
        { "name": "Veracode" },

    {

      "why": "So the Logs and Performance links on an environment open your team's own dashboards, not seaLeye's.",
      "providers": [

        { "name": "Splunk" },
        { "name": "Dynatrace" },
        { "name": "Grafana Cloud" }

    {

      "why": "So seaLeye is the deploy action inside the portal your developers already use, and seaLeye.online stays the platform team's view.",
      "providers": [

        { "name": "Cortex" }
      ]

    {
      "job": "Tell people when things happen",
      "why": "So a finished deploy, a refusal or an incident reaches the team channel without anyone checking a page.",

  "catalog_of_providers": {
    "Build what the plan describes": ["AWS CloudFormation", "HashiCorp Terraform", "OpenTofu", "Pulumi", "AWS CDK", "Azure Resource Manager", "Google Cloud Infrastructure Manager", "Crossplane"],

</script>

<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<div class="topbar">
  <div class="inner">
    <span class="wordmark"><img src="sealeye-online-wordmark-light.svg" alt="seaLeye.online"></span>
    <nav id="nav"></nav>
    <div class="who"><span id="org"></span><span class="disc" id="userDisc"></span><span id="userName"></span></div>
  </div>
</div>

<main>

  <div class="title">
    <div>
      <h1 id="pageTitle"></h1>
      <p class="sub" id="pageSub"></p>
    </div>
  </div>

  <p class="infostrip" id="notice"></p>

  <div class="jobs" id="jobs"></div>

  <footer id="footer"></footer>
</main>

<script src="console.js"></script>
<script>
  const state = JSON.parse(document.getElementById("state").textContent);
  const { el, chip } = Console;

  Console.chrome(state, "Integrations");
  document.getElementById("pageTitle").textContent = state.page.title;
  document.getElementById("pageSub").textContent = state.page.subtitle;
  document.getElementById("notice").textContent = state.notice;

  const jobs = document.getElementById("jobs");

  /** A row in a lead card: the thing, what it is, and a chip saying where it stands. */
  function leadRow(name, tone, chipText, lines) {
    const r = el("div", "provider");
    const left = el("div", "who2");
    left.appendChild(el("div", "name", name));
    for (const [cls, text] of lines) left.appendChild(el("div", cls, text));
    r.appendChild(left);
    const action = el("div", "action");
    action.appendChild(chip(chipText, tone));
    r.appendChild(action);
    return r;
  }

  // Infrastructure as code and CI/CD are not integrations you shop for. Until they are
  // connected and the library is ingested, seaLeye cannot do the thing it exists to do,
  // so these two state what is in place and offer nothing to press.
  for (const lead of state.lead) {
    const card = el("div", "job" + (lead.connected ? " connected" : ""));
    card.appendChild(el("h3", null, lead.job));

    const list = el("div", "providers");

    for (const item of lead.inPlace) {
      list.appendChild(leadRow(item.name, "phosphor", "Connected", [
        ["detail", item.says],
        ["detail mono", item.data]
      ]));
    }

    if (!lead.inPlace.length && lead.nothing) {
      const none = el("div", "provider");
      const left = el("div", "who2");
      left.appendChild(el("div", "inplace none", "Nothing connected"));
      left.appendChild(el("div", "detail", lead.nothing));
      none.appendChild(left);
      none.appendChild(el("div", "action"));
      list.appendChild(none);
    }

    card.appendChild(list);
    if (lead.note) card.appendChild(el("p", "note", lead.note));
    jobs.appendChild(card);
  }

  // Everything else is ancillary: useful, not load bearing, and picked one vendor at a
  // time. Grouped by the job rather than by the vendor, because a developer arrives
  // knowing what they want to happen and not who sells it. Within a group the providers
  // are competitors, so at most one of them is ever connected.
  for (const group of state.groups) {
    const connected = group.providers.some(p => p.connected);
    const card = el("div", "job" + (connected ? " connected" : ""));

    card.appendChild(el("h3", null, group.job));
    card.appendChild(el("p", "why", group.why));
    if (group.note) card.appendChild(el("p", "note", group.note));

    const list = el("div", "providers");

    for (const provider of group.providers) {
      const row = el("div", "provider");

      const left = el("div", "who2");
      left.appendChild(el("div", "name", provider.name));
      // The detail is what this connection actually is: a tenant, a project, a count.
      // Mono, because every part of it is an identifier or a number someone can check.
      if (provider.connected && provider.detail) {
        left.appendChild(el("div", "detail mono", provider.detail));
      }
      row.appendChild(left);

      const action = el("div", "action");

      if (provider.connected) {
        action.appendChild(chip("Connected", "phosphor"));
      } else {
        const ask = el("button", "ghost small", "Request");
        ask.type = "button";
        ask.setAttribute("aria-label", "Request " + provider.name);
        // No dialog and nothing else moves: the button becomes the state it asked for,
        // in place. Nothing is stored, because a request is a note to a Site Admin and
        // this page is not where it lives.
        ask.addEventListener("click", () => {
          const asked = chip("Requested", "neutral");
          asked.setAttribute("role", "status");
          asked.title = "A note has gone to your Site Admin";
          ask.replaceWith(asked);
        });
        action.appendChild(ask);
      }

      row.appendChild(action);
      list.appendChild(row);
    }

    card.appendChild(list);
    jobs.appendChild(card);
  }

  const admin = el("p", "adminline", state.adminLine);
  document.querySelector("main").insertBefore(admin, document.getElementById("footer"));
</script>
</body>
</html>
