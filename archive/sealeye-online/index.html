<script src="console.js"></script>
<script>
  const state = JSON.parse(document.getElementById("state").textContent);
  const { el } = Console;

  Console.chrome(state, "Environments");

  const footer = document.getElementById("footer");
  const state_line = footer.textContent;
  footer.textContent = "";
  footer.appendChild(el("div", null,
    "Developers deploy to dev. The plan they approve is what the later stages are built from."));
  footer.appendChild(el("div", null, state_line));
  document.getElementById("pageTitle").textContent = state.page.title;
  document.getElementById("pageSub").textContent = state.page.subtitle;
  document.getElementById("primary").textContent = state.page.action;

  const stats = document.getElementById("stats");
  for (const stat of state.stats) {
    const box = el("div", "stat");
    box.appendChild(el("div", "n", stat.value));
    box.appendChild(el("div", "l", stat.label));
    stats.appendChild(box);
  }

  /** One group of the decision card, in the same words the terminal uses. */
  function group(heading, rows, tone) {
    const box = el("div", "group" + (tone ? " " + tone : ""));
    box.appendChild(el("h3", null, heading));

    for (const row of rows) {
      if (typeof row === "string") { box.appendChild(el("div", "plain", row)); continue; }

      const line = el("div", "row");
      line.appendChild(el("span", "id", row.id));

      line.appendChild(el("span", "what", row.line));
      box.appendChild(line);
    }

    return box;
  }

  /**
   * @param {object}   env
   * @param {function} [onReport]  called right after a ticket is created, so the row
   *                               that opened the modal can redraw itself with the
   *                               new row in it without the developer closing and
   *                               reopening the card to see it.
   */
  function card(env, onReport) {
    const box = el("div", "cardbox");
    box.appendChild(group("Your app:", [env.card.app]));
    box.appendChild(group("We will build your dev environment with:", env.card.modules));
    // What the app needs that nothing in the catalog builds, straight after what will
    // be built, because they are two halves of the same answer.
    if (env.card.needs && env.card.needs.length) {
      box.appendChild(group("Your app also needs, and no module in your catalog supports yet:", env.card.needs, "needs"));
    }
    if (env.card.patterns && env.card.patterns.length) {
      box.appendChild(group("Patterns your " + env.profile + " environment applies:", env.card.patterns));
    }
    box.appendChild(group("You will get back:", env.card.back));

    // Something can only be going wrong with an environment that is actually up.
    if (env.status === "live") {
      const foot = el("div", "foot");
      const report = el("button", "ghost amber", "Report a problem");
      report.type = "button";
      report.addEventListener("click", event => {
        event.stopPropagation();
        openReportModal(env, onReport);
      });
      foot.appendChild(report);
      box.appendChild(foot);
    }

    // What has been reported this session. Its own markup rather than group(): a
    // ticket needs a status between its id and its subject, which group() has no
    // shape for, since modules and patterns never carry one.
    if (env.reportedTickets && env.reportedTickets.length) {
      const reported = el("div", "group");
      reported.appendChild(el("h3", null, "Issues reported"));

      for (const ticket of env.reportedTickets) {
        const line = el("div", "row");

        const link = el("a", "id mono", ticket.id);
        link.href = "#";
        // Nothing behind it yet to open: it reads as a real ticket link, the same
        // phosphor and underline as any other link on this page, without pretending
        // there is a detail view here that this mock does not have.
        link.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
        line.appendChild(link);

        line.appendChild(chip(ticket.status, ticket.status === "Open" ? "amber" : "neutral"));
        line.appendChild(el("span", "what", ticket.subject));

        reported.appendChild(line);
      }

      box.appendChild(reported);
    }

    return box;
  }

  // The next ticket a submitted report would open. In-memory only, like every other
  // mocked write on this console: nothing here is a real Jira call, and nothing here
  // survives a reload.
  let nextTicketNumber = 1043;

  /**
   * "Report a problem", opened from a live environment's card. Simulates the same
   * write Cindy's refused plan already makes for real in the fixture: a ticket, with
   * a subject, a description, and the handful of fields a platform team would need to
   * action it, none of which this page actually sends anywhere.
   */
  function openReportModal(env, onReport) {
    const overlay = el("div", "modal-overlay");

    const modal = el("div", "modal");
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");

    const head = el("div", "modal-head");
    const headText = el("div");
    const h2 = el("h2", null, "Report a problem");
    h2.id = "reportTitle";
    headText.appendChild(h2);
    headText.appendChild(
      el("div", "modal-sub", env.app + (env.deploymentId ? "  ·  " + env.deploymentId : ""))
    );
    head.appendChild(headText);
    modal.setAttribute("aria-labelledby", "reportTitle");

    const closeBtn = el("button", "modal-close", "✕");
    closeBtn.type = "button";
    closeBtn.setAttribute("aria-label", "Close");
    head.appendChild(closeBtn);
    modal.appendChild(head);

    const form = el("form", "modal-form");

    // What the platform team would need to action the ticket, filled in from what
    // the console already knows, so the developer only ever types the two things
    // only they know: what happened, and what they expected instead.
    const context = el("div", "modal-context");
    const fact = (label, value) => {
      const span = el("span");
      span.appendChild(document.createTextNode(label + ": "));
      span.appendChild(el("strong", null, value));
      return span;
    };
    context.appendChild(fact("Reporter", state.user.name));
    context.appendChild(fact("Project", "PLAT"));
    context.appendChild(fact("Issue type", "Bug"));
    form.appendChild(context);

    const error = el("p", "modal-error", "Add a subject and a description before you submit.");
    error.hidden = true;
    form.appendChild(error);

    const subjectField = el("div", "modal-field");
    const subjectLabel = el("label", null, "Subject");
    subjectLabel.htmlFor = "reportSubject";
    const subjectInput = el("input");
    subjectInput.type = "text";
    subjectInput.id = "reportSubject";
    subjectInput.placeholder = "One line describing what is wrong";
    subjectInput.maxLength = 120;
    subjectField.appendChild(subjectLabel);
    subjectField.appendChild(subjectInput);
    form.appendChild(subjectField);

    const descField = el("div", "modal-field");
    const descLabel = el("label", null, "Description");
    descLabel.htmlFor = "reportDescription";
    const descInput = el("textarea");
    descInput.id = "reportDescription";
    descInput.placeholder =
      "What happened, what you expected instead, and anything the platform team would need to reproduce it";
    descField.appendChild(descLabel);
    descField.appendChild(descInput);
    form.appendChild(descField);

    const priorityField = el("div", "modal-field");
    const priorityLabel = el("label", null, "Priority");
    priorityLabel.htmlFor = "reportPriority";
    const prioritySelect = el("select");
    prioritySelect.id = "reportPriority";
    for (const level of ["Low", "Medium", "High"]) {
      const option = el("option", null, level);
      option.value = level;
      if (level === "Medium") option.selected = true;
      prioritySelect.appendChild(option);
    }
    priorityField.appendChild(priorityLabel);
    priorityField.appendChild(prioritySelect);
    form.appendChild(priorityField);

    const actions = el("div", "modal-actions");
    const cancelBtn = el("button", "ghost", "Cancel");
    cancelBtn.type = "button";
    const submitBtn = el("button", "primary", "Submit");
    submitBtn.type = "submit";
    actions.appendChild(cancelBtn);
    actions.appendChild(submitBtn);
    form.appendChild(actions);

    modal.appendChild(form);
    overlay.appendChild(modal);

    function closeModal() {
      overlay.remove();
      document.removeEventListener("keydown", onKey);
    }

    function onKey(event) {
      if (event.key === "Escape") closeModal();
    }

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeModal();
    });
    closeBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);
    document.addEventListener("keydown", onKey);

    form.addEventListener("submit", event => {
      event.preventDefault();
      const subject = subjectInput.value.trim();
      const description = descInput.value.trim();

      if (!subject || !description) {
        error.hidden = false;
        (subject ? descInput : subjectInput).focus();
        return;
      }
      error.hidden = true;

      // A short wait, the same shape as any other platform action: something is
      // happening out there, and then it is done. Nothing here is stored; a real
      // Jira call is the thing this stands in for.
      actions.replaceChildren();
      const wait = el("span", "modal-wait");
      wait.appendChild(el("span", "spin"));
      wait.appendChild(document.createTextNode("Creating the ticket"));
      actions.appendChild(wait);

      setTimeout(() => {
        const ticketId = "PLAT-" + nextTicketNumber++;
        // "Open" is the initial status of a newly filed bug in this Jira project,
        // matching PLAT-1042: the one already on this page.
        const status = "Open";

        // Kept on the environment itself, not on the modal: the modal is thrown away
        // when it closes, and the card is rebuilt from env every time it opens, so
        // this is the one place a new ticket can actually live.
        env.reportedTickets = env.reportedTickets || [];
        env.reportedTickets.push({ id: ticketId, subject, status });
        if (onReport) onReport();

        form.textContent = "";
        form.classList.add("modal-result");

        const resultHead = el("div", "tickethead");
        const line = el("div", "ticketline");
        line.appendChild(el("span", "mono id", ticketId));
        line.appendChild(chip(status, "amber"));
        resultHead.appendChild(line);
        resultHead.appendChild(el("p", "subject", subject));
        form.appendChild(resultHead);

        form.appendChild(
          el("p", "notice", "Opened with your platform team. They will follow up in " + ticketId + ".")
        );

        const doneActions = el("div", "modal-actions");
        const doneBtn = el("button", "primary", "Done");
        doneBtn.type = "button";
        doneBtn.addEventListener("click", closeModal);
        doneActions.appendChild(doneBtn);
        form.appendChild(doneActions);

        doneBtn.focus();
      }, 900);
    });

    document.body.appendChild(overlay);
    subjectInput.focus();
  }

  let openMenu = null;

  function closeMenu() {
    if (!openMenu) return;
    openMenu.menu.hidden = true;
    openMenu.button.setAttribute("aria-expanded", "false");
    openMenu = null;
  }

  document.addEventListener("click", closeMenu);
  document.addEventListener("scroll", closeMenu, true);
  window.addEventListener("resize", closeMenu);
  document.addEventListener("keydown", event => { if (event.key === "Escape") closeMenu(); });

  /**
   * One menu on a row: a heading so the developer knows which of the two they opened,
   * then its items. An item is { label, href } for a page of its own, { label, run }
   * for something this page does, { label } for a thing the console has but this
   * version does not do, and { label, disabled: true } when it cannot be done for
   * this row at all: a plan that was never built has no costs, logs or settings.
   */
  function kebab(env, heading, items) {
    const holder = el("span");

    const button = el("button", "kebab", "\u22EE");
    button.type = "button";
    button.setAttribute("aria-haspopup", "menu");
    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-label", heading + " for " + env.app);

    const menu = el("div", "menu");
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", heading + " for " + env.app);
    menu.hidden = true;
    // The menu carries the same words as its aria-label, so the visible heading is
    // decoration to a screen reader and says so.
    const title = el("h4", null, heading);
    title.setAttribute("aria-hidden", "true");
    menu.appendChild(title);

    let first = null;

    for (const spec of items) {
      let item;
      if (spec.href && !spec.disabled) {
        item = el("a", null, spec.label);
        item.href = spec.href;
        item.addEventListener("click", event => event.stopPropagation());
      } else {
        item = el("button", null, spec.label);
        item.type = "button";
        item.addEventListener("click", event => {
          event.stopPropagation();
          if (spec.disabled) return;
          closeMenu();
          if (spec.run) spec.run();
        });
      }
      item.setAttribute("role", "menuitem");
      if (spec.disabled) item.setAttribute("aria-disabled", "true");
      menu.appendChild(item);
      if (!first && !spec.disabled) first = item;
    }

    button.addEventListener("click", event => {
      event.stopPropagation();
      const wasOpen = openMenu && openMenu.menu === menu;
      closeMenu();
      if (wasOpen) return;

      const box = button.getBoundingClientRect();
      menu.hidden = false;
      menu.style.top = box.bottom + 6 + "px";
      menu.style.left = Math.max(8, box.right - menu.offsetWidth) + "px";
      button.setAttribute("aria-expanded", "true");
      openMenu = { menu, button };
      if (first) first.focus();
    });

    holder.appendChild(button);
    holder.appendChild(menu);

    return holder;
  }

  /**
   * The ticket seaLeye.run opened when it refused this plan. Every word of it comes
   * from the same fixture the CLI reads, so the console and the terminal cannot tell
   * the room two different stories about the same ticket.
   */
  function ticketPanel(env) {
    const context = state.teamContext;
    const ticket = context.ticket;
    const box = el("div", "cardbox");

    const head = el("div", "group tickethead");
    const line = el("div", "ticketline");
    line.appendChild(el("span", "mono id", ticket.id));
    line.appendChild(chip(ticket.status, ticket.status === "Open" ? "amber" : "neutral"));
    head.appendChild(line);
    head.appendChild(el("p", "subject", ticket.subject));
    box.appendChild(head);

    const body_ = el("div", "group");
    // The description arrives with its line breaks and keeps them: it is a ticket
    // body, and a ticket body reflowed into a paragraph stops being readable.
    body_.appendChild(el("pre", "ticketbody", ticket.description));
    box.appendChild(body_);

    const foot = el("div", "group");
    foot.appendChild(el("p", "notice", `Opened from ${context.priorAttempt.by}'s refused plan, ${context.priorAttempt.when}`));
    box.appendChild(foot);

    return box;
  }

  const chip = Console.chip;

  const body = document.getElementById("rows");
  const listed = [];

  for (const env of state.environments) {
    // A destroyed environment is history, not something still running: the whole row
    // reads in the same grey as its own status chip, rather than staying full strength
    // everywhere except the one label that says so.
    const row = el("tr", env.status === "destroyed" ? "env destroyed" : "env");
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-expanded", "false");

    row.appendChild(el("td", "mono app", env.app));

    const owner = el("td");
    const who = el("div", "owner");
    who.appendChild(el("span", "disc", env.owner.initial));
    who.appendChild(el("span", null, env.owner.name));
    owner.appendChild(who);
    row.appendChild(owner);

    const status = el("td");
    status.appendChild(el("span", "chip " + (env.chip || "neutral"), env.status));
    row.appendChild(status);

    // Where this app's plan has reached. Developers deploy to dev; the stages after it
    // are built from the same plan by the pipeline, so the strip reads left to right.
    const path = el("td", "path");
    const strip = el("div", "stages");
    for (const stage of state.stages) {
      const lit = (env.path || []).includes(stage);
      const mark = el("span", "chip stage " + (lit ? "phosphor" : "unlit"), stage);
      mark.title = lit ? stage + " has been built from this plan" : stage + " has not been built yet";
      strip.appendChild(mark);
    }
    path.appendChild(strip);
    row.appendChild(path);

    // A request against the Platform Library, not traffic the app has served: the
    // ticket a refusal opened, or none, because most plans never hit that boundary.
    const requests = el("td", "requests");
    if (env.ticket) {
      const link = el("a", "mono ticket", env.ticket);
      link.href = "#";
      link.title = "Show the ticket seaLeye.run opened";
      link.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        showTicket(env);
      });
      requests.appendChild(link);
    } else {
      requests.appendChild(el("span", "none", "none"));
    }
    row.appendChild(requests);

    const holder = el("tr", "card");
    holder.hidden = true;
    const cell = el("td");
    cell.colSpan = 7;
    holder.appendChild(cell);

    // Draws whichever of the plan or the ticket into the cell, without touching
    // whether the row is open. Shared by toggle(), which opens or closes the row,
    // and refreshCard(), which redraws it in place while it is already open, so a
    // ticket just reported shows up without the developer closing and reopening it.
    const draw = wanted => {
      cell.textContent = "";
      cell.appendChild(wanted === "ticket" ? ticketPanel(env) : card(env, refreshCard));
      holder.dataset.showing = wanted;
    };

    const refreshCard = () => {
      if (!holder.hidden && holder.dataset.showing === "plan") draw("plan");
    };

    const toggle = (what) => {
      const wanted = what || "plan";
      // Clicking the row after opening a ticket shows the plan, and the other way
      // round, rather than closing something the reader did not mean to close.
      if (!holder.hidden && holder.dataset.showing === wanted) {
        holder.hidden = true;
        row.setAttribute("aria-expanded", "false");
        return;
      }
      draw(wanted);
      holder.hidden = false;
      row.setAttribute("aria-expanded", "true");
    };

    const showTicket = () => toggle("ticket");

    // Only a live environment has pages behind these. A plan that was never built has
    // a plan to look at and nothing else, and the menu says so rather than hiding it.
    const live = env.status === "live";
    const page = name => name + ".html?app=" + encodeURIComponent(env.app) +
      (env.deploymentId ? "&env=" + env.deploymentId : "");
    // What is left of an environment once it is gone: what it cost, and its plan.
    const billed = live || env.status === "destroyed";

    const actions = el("td", "menucol");
    actions.appendChild(kebab(env, "Actions", [
      { label: "Plan", run: () => { if (holder.hidden) toggle(); } },
      { label: "Configure", href: page("configure"), disabled: !live },
      { label: "Control", href: page("control"), disabled: !live }
    ]));
    row.appendChild(actions);

    const info = el("td", "menucol");
    info.appendChild(kebab(env, "Info", [
      { label: "Costs", href: page("costs"), disabled: !billed },
      { label: "Logs", href: page("logs"), disabled: !live },
      { label: "Performance", href: page("performance"), disabled: !live }
    ]));
    row.appendChild(info);

    row.addEventListener("click", () => toggle("plan"));
    row.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle("plan"); }
    });

    body.appendChild(row);
    body.appendChild(holder);
    listed.push({ env, row, holder });
  }

  // Coming back from one of an environment's pages, the link names the app in the
  // hash; open its card so the reader lands where they left.
  const wanted = decodeURIComponent(location.hash.slice(1));
  const back = wanted && listed.find(item => item.env.app === wanted);
  if (back) {
    back.holder.hidden = false;
    back.row.setAttribute("aria-expanded", "true");
    back.row.scrollIntoView({ block: "center" });
  }

  // ---- finding things in a long list ----

  const search = document.getElementById("search");
  const toggles = {
    live: document.getElementById("toggleLive"),
    drafted: document.getElementById("toggleDrafted"),
    destroyed: document.getElementById("toggleDestroyed")
  };
  const profile = document.getElementById("profile");
  const count = document.getElementById("count");
  const empty = document.getElementById("empty");

  // The profiles the page actually has, in the order the catalog names them, so the
  // dropdown never offers a profile nothing is running.
  const PROFILE_ORDER = ["poc", "dev", "perf", "prod"];
  const present = [...new Set(state.environments.map(e => e.profile))]
    .sort((a, b) => PROFILE_ORDER.indexOf(a) - PROFILE_ORDER.indexOf(b));

  profile.appendChild(new Option("All profiles", ""));
  for (const id of present) profile.appendChild(new Option(id, id));

  function matches(env) {
    const term = search.value.trim().toLowerCase();
    if (term && !(env.app + " " + env.owner.name).toLowerCase().includes(term)) return false;

    const pressed = toggles[env.status];
    if (pressed && pressed.getAttribute("aria-pressed") === "false") return false;

    if (profile.value && env.profile !== profile.value) return false;

    return true;
  }

  function filter() {
    closeMenu();
    let shown = 0;

    for (const item of listed) {
      const keep = matches(item.env);
      item.row.hidden = !keep;
      if (!keep) {
        item.holder.hidden = true;
        item.row.setAttribute("aria-expanded", "false");
      }
      if (keep) shown += 1;
    }

    empty.hidden = shown > 0;
    count.innerHTML = "";
    count.appendChild(el("span", "n", String(shown)));
    count.appendChild(document.createTextNode(" of "));
    count.appendChild(el("span", "n", String(listed.length)));
  }

  search.addEventListener("input", filter);
  profile.addEventListener("change", filter);

  for (const toggle of Object.values(toggles)) {
    toggle.addEventListener("click", () => {
      toggle.setAttribute("aria-pressed", toggle.getAttribute("aria-pressed") === "true" ? "false" : "true");
      filter();
    });
  }

  filter();

</script>
</body>
</html>
