AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The role seaLeye deploys a team's apps through (OPEN-QUESTIONS Q4, DESIGN.md "One
  small server in ca-central-1"). Deploy it in the account the team's environments live
  in; for the pilot that is the same account as the server. Deploy as
  platform-sealeye-deploy-role. It can build only what seaLeye's module templates
  contain, and only under seaLeye's names.

Parameters:
  ServerRoleArn:
    Description: The ServerRoleArn output of platform-sealeye-server
    Type: String
    AllowedPattern: "arn:aws:iam::\\d{12}:role/.+"
  ArtifactBucket:
    Description: The bucket seaLeye uploads function code to (SEALEYE_BUCKET)
    Type: String
  RoleSuffix:
    Description: Names the role sealeye-deploy-<suffix>, one per team
    Type: String
    Default: pilot
    AllowedPattern: "[a-z0-9-]+"

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "sealeye-deploy-${RoleSuffix}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref ServerRoleArn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sealeye-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Stacks are sealeye-<team>-<app>-<hash>, or sealeye-<app> for one made
              # before teams had names of their own (core/names.js). `aws cloudformation deploy`
              # works through change sets, and the evidence reads events and templates.
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sealeye-*/*"
              - Sid: TemplatesAndIdentity
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary, sts:GetCallerIdentity]
                Resource: "*"
              # http_api_serverless: the function's role, generated by CloudFormation as
              # <stack name>-FunctionRole-<random>, with Lambda's basic logging policy
              # and nothing else. Never this role itself, and never any other.
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-FunctionRole-*"
              - Sid: FunctionRolePolicy
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-FunctionRole-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassFunctionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-FunctionRole-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: Functions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                # Functions are named after their environment, sealeye-... (DESIGN.md,
                # "Each team's environments have names of their own"), so no other
                # function in the account is within reach.
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sealeye-*"
              # The Lambda Web Adapter layer, published by AWS in its own account.
              - Sid: AdapterLayer
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayer*:*"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sealeye-*"
              - Sid: DescribeLogs
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: HttpApis
                Effect: Allow
                Action: [apigateway:GET, apigateway:POST, apigateway:PUT, apigateway:PATCH, apigateway:DELETE]
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis/*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"
              - Sid: FunctionCode
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/*"
              - Sid: FunctionCodeBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}"
              # static_site_edge: one public website bucket per environment, named
              # <environment name>-<account> by its template (sealeye-...), synced after
              # the stack exists and emptied before it is deleted. The platform's own
              # bucket, platform-sealeye-<account>-<region>, is not one of them.
              - Sid: SiteBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketWebsite
                  - s3:GetBucketWebsite
                  - s3:DeleteBucketWebsite
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                Resource: !Sub "arn:aws:s3:::sealeye-*-${AWS::AccountId}"
              - Sid: SiteFiles
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "arn:aws:s3:::sealeye-*-${AWS::AccountId}/*"

Outputs:
  DeployRoleArn:
    Description: Store as /sealeye/SEALEYE_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
