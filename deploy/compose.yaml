# The pilot server: the API behind Caddy, which obtains and renews the TLS certificate
# itself, Postgres for records and interviews (Step 10), and the model gateway
# (PHASE3-PLAN Step 5), which holds the model key and through which every model call
# goes. Postgres and the gateway publish no port. The gateway sits on a network of its
# own that only the API joins. Started by deploy/update.sh on the server.
services:
  api:
    image: ${SEALEYE_IMAGE:?set SEALEYE_IMAGE to the image to run}
    restart: unless-stopped
    environment:
      SEALEYE_SSM_PATH: /sealeye/
      # start.mjs builds DATABASE_URL from this and /sealeye/POSTGRES_PASSWORD.
      SEALEYE_DATABASE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sealeye-data:/data
    networks: [default, model]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    # agentgateway v1.6.0, by the digest the Step 4 spike read and ran (DESIGN.md,
    # "agentgateway, read and run (Step 4)"). A new version is a new digest, run through
    # the spike first.
    image: ghcr.io/agentgateway/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    restart: unless-stopped
    command: ["-f", "/config/gateway.yaml"]
    # ANTHROPIC_API_KEY, SEALEYE_GATEWAY_KEY and SEALEYE_GATEWAY_BUDGET, written by
    # deploy/gateway.sh from Parameter Store (deploy/README.md, "The model gateway").
    env_file: ./secrets/gateway.env
    volumes:
      - ./gateway.yaml:/config/gateway.yaml:ro
      # The public half of the API's signing key, written by deploy/gateway.sh.
      - ./gateway-jwks.json:/config/jwks.json:ro
      - ./gateway-data:/data
    # Only the API can reach it, and it publishes no port. It still reaches the model's
    # address on the internet, since the network is not an internal one.
    networks: [model]
    expose:
      - "4000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sealeye
      POSTGRES_DB: sealeye
      # Written from /sealeye/POSTGRES_PASSWORD by update.sh; read once, when the
      # database is first created.
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./secrets/pg_password:/run/secrets/pg_password:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sealeye", "-d", "sealeye"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.sealeye.online}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-sealeye.online}
      RUN_DOMAIN: ${RUN_DOMAIN:-sealeye.run}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/srv:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  default:
  model:

volumes:
  pgdata:
  sealeye-data:
  caddy-data:
  caddy-config:
