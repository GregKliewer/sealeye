AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The role seaLeye builds an organization's own Terraform modules through (PHASE4-PLAN
  Step 9; DESIGN.md, "A Terraform executor builds an organization's own modules"). A
  second role beside platform-sealeye-deploy-role, which is unchanged. Deploy it in the
  account the environments live in, as platform-sealeye-terraform-role. It can create
  what the made-up organization's http-api and static-site modules create, and the
  document-table, file-bucket, work-queue and postgres modules an app uses beside them
  (a database with its one-time setup function and the security group of its own that
  function connects from), under the names seaLeye gives them (sealeye-<app>-<hash>, at
  the dev stage), and read and write their state, and nothing else. The platform's own
  security groups (platform-sealeye-*) it can never change.

Parameters:
  ServerRoleArn:
    Description: The ServerRoleArn output of platform-sealeye-server
    Type: String
    AllowedPattern: "arn:aws:iam::\\d{12}:role/.+"
  ArtifactBucket:
    Description: The bucket seaLeye keeps artifacts in (SEALEYE_BUCKET); state goes under tofu-state/ in it
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: an S3 bucket name, such as the SEALEYE_BUCKET the API uses
  RoleSuffix:
    Description: Names the role sealeye-deploy-terraform-<suffix>
    Type: String
    Default: pilot
    AllowedPattern: "[a-z0-9-]+"

Resources:
  # The most a function built from an organization's module may do, whatever its own
  # role says: write its logs, join the private network, use the table, bucket and queue
  # of its own environment, the ones the modules it uses make (sealeye-<app>-<hash>-dev),
  # and sign in to its database with its own identity. Never read a master password: a
  # database's setup function carries the SetupBoundary below instead. The policies that
  # grant any of it are the library's (access_policy_arn); this only bounds them.
  # Set it as the organization's permissions_boundary_arn platform value (sealeye
  # platform set permissions_boundary_arn <arn>). The role below creates a function's
  # role only with this boundary on it.
  FunctionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "sealeye-function-boundary-terraform-${RoleSuffix}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: "*"
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:BatchGetItem, dynamodb:Query, dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem, dynamodb:ConditionCheckItem, dynamodb:DescribeTable]
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sealeye-*-dev"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sealeye-*-dev/index/*"
          - Effect: Allow
            Action: s3:ListBucket
            Resource: "arn:aws:s3:::*-files-sealeye-*-dev"
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: "arn:aws:s3:::*-files-sealeye-*-dev/*"
          - Effect: Allow
            Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes, sqs:GetQueueUrl]
            Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:sealeye-*-dev"
          # Joining the private network: the network interfaces the platform makes for a
          # function there (the role needs them only to make the interfaces).
          - Effect: Allow
            Action: [ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DeleteNetworkInterface, ec2:DescribeSubnets, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
            Resource: "*"
          # Signing in to a database as the user its module made. The ARN names the
          # database by the id the platform gave it, not its name, so this is bounded by
          # the library's policy (one database, one user) and not by a name here.
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/*"

  # The most a database's one-time setup function may do: write its logs, join the
  # private network, and read the master password the platform keeps for a database
  # (rds!db-...). Only this boundary allows that read, so no app's function can be
  # given it, whatever a policy says. Set it as the organization's
  # postgres.permissions_boundary_arn platform value; the role below creates a setup
  # function's role only with this boundary on it.
  SetupBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "sealeye-setup-boundary-terraform-${RoleSuffix}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: "*"
          - Effect: Allow
            Action: [ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DeleteNetworkInterface, ec2:DescribeSubnets, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
            Resource: "*"
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*"
          # The password is encrypted with the account's default key for secrets, which
          # the setup function uses only through the secrets service.
          - Effect: Allow
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"

  # The role's logs permissions, apart from its inline policy, which IAM holds to
  # 10,240 characters for a role (the front door's and the database's logs, Oct 22,
  # 2026, would have taken it past). Attached to the role below.
  TerraformLogs:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "sealeye-deploy-terraform-logs-${RoleSuffix}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
              - logs:TagLogGroup
              - logs:UntagLogGroup
              - logs:ListTagsLogGroup
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sealeye-*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sealeye-*:*"
              # http-api's front door record, and postgres's own log and refused
              # sign-ins (DESIGN.md, "The front door's and the database's lines,
              # beside the app's").
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/apigateway/sealeye-*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/apigateway/sealeye-*:*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/sealeye-*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/sealeye-*:*"
          # A front door that keeps a record of requests: API Gateway delivers it
          # through the log service's deliveries, which the caller sets up, and
          # these name no resource (API Gateway developer guide, "Configure logging
          # for HTTP APIs", Permissions to activate logging).
          - Sid: AccessLogDelivery
            Effect: Allow
            Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies]
            Resource: "*"
          - Sid: DescribeLogs
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: "*"
          # Reading an app's logs back to its developer (`sealeye logs`), from the
          # group the organization's module said it keeps them in: the API asks only
          # for the group on the environment's record, and may read none but an
          # environment's own (DESIGN.md, "A Terraform environment's logs are read
          # where its module says they are", Greg, Oct 22, 2026).
          - Sid: ReadAppLogs
            Effect: Allow
            Action: logs:FilterLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sealeye-*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sealeye-*:*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/apigateway/sealeye-*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/apigateway/sealeye-*:*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/sealeye-*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/sealeye-*:*"

  TerraformRole:
    Type: AWS::IAM::Role
    Properties:
      # sealeye-deploy-*, which the server's role may become (deploy/server.yaml).
      RoleName: !Sub "sealeye-deploy-terraform-${RoleSuffix}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref ServerRoleArn }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref TerraformLogs
      Policies:
        - PolicyName: sealeye-deploy-terraform
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Identity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"

              # State, one object per environment under tofu-state/, and its lock file
              # beside it. Nothing else in the platform's bucket.
              - Sid: State
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/tofu-state/*"
              - Sid: StateList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}"
                Condition:
                  StringLike:
                    s3:prefix: ["tofu-state/*"]

              # http-api: the function's role, ${name}-${stage}-api, so sealeye-*-dev-api;
              # postgres: its one-time setup function's role, sealeye-*-dev-db-setup.
              # Created only with the boundary above on it; its policies changed only while
              # it is; only Lambda's own logging and network policies attached, and the
              # library's.
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRoleTags
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-api"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-db-setup"
              - Sid: FunctionRolesWithinBoundary
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePermissionsBoundary]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-api"
                Condition:
                  ArnEquals:
                    iam:PermissionsBoundary: !Ref FunctionBoundary
              - Sid: SetupRolesWithinBoundary
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePermissionsBoundary]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-db-setup"
                Condition:
                  ArnEquals:
                    iam:PermissionsBoundary: !Ref SetupBoundary
              # Lambda's basic logging and network policies, and the policies the modules
              # an app uses make for it (access_policy_arn, under its environment's name).
              # The boundary above bounds what any of them can grant.
              - Sid: FunctionRolePolicy
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-api"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-db-setup"
                Condition:
                  ArnLike:
                    iam:PolicyARN:
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
                      - !Sub "arn:aws:iam::${AWS::AccountId}:policy/sealeye-*-dev-*"
              # The secrets an app may read, as the role's own policy (http-api's
              # secret_arns), and the master password the setup function reads once.
              - Sid: FunctionRoleOwnPolicy
                Effect: Allow
                Action: [iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy]
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-api"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-db-setup"
              # The policies a table, bucket or queue module makes for the app that uses
              # it: named after its environment, at dev.
              - Sid: AccessPolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                  - iam:ListEntitiesForPolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:policy/sealeye-*-dev-*"
              - Sid: KeepTheBoundary
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: "*"
              - Sid: PassFunctionRole
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-api"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sealeye-*-dev-db-setup"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

              # http-api: the function, sealeye-*-dev-api, read the way the provider reads
              # one, and its log group; postgres: its one-time setup function,
              # sealeye-*-dev-db-setup, which the build runs once.
              - Sid: Functions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:Get*
                  - lambda:List*
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sealeye-*-dev-api"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sealeye-*-dev-db-setup"
              # The provider runs it at a version, $LATEST, which Lambda names as a resource
              # of its own (the first build, Oct 21, 2026).
              - Sid: SetupFunctionRuns
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sealeye-*-dev-db-setup"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sealeye-*-dev-db-setup:*"
              # Putting a function in the private network: what the platform checks of the
              # network when it is asked to.
              - Sid: NetworkRead
                Effect: Allow
                Action: [ec2:DescribeSecurityGroups, ec2:DescribeSecurityGroupRules, ec2:DescribeSubnets, ec2:DescribeVpcs, ec2:GetSecurityGroupsForVpc, ec2:DescribeNetworkInterfaces, ec2:DescribeTags]
                Resource: "*"
              # http-api: its HTTPS address. API Gateway names nothing in an ARN, as the
              # CloudFormation role's statement says too.
              # Every part of it is tagged as it is made (the provider's default tags), and
              # API Gateway asks for its own tagging actions for that, beside the method
              # ones: without them a stage cannot be made (the first build, Oct 17, 2026).
              - Sid: HttpApis
                Effect: Allow
                Action: [apigateway:GET, apigateway:POST, apigateway:PUT, apigateway:PATCH, apigateway:DELETE, apigateway:TagResource, apigateway:UntagResource]
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis/*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"

              # document-table: the table, ${name}-${stage}, so sealeye-*-dev.
              - Sid: Tables
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sealeye-*-dev"
              # work-queue: the queue and its failed queue, sealeye-*-dev and -dev-failed.
              - Sid: Queues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                  - sqs:PurgeQueue
                Resource:
                  - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:sealeye-*-dev"
                  - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:sealeye-*-dev-failed"
              # postgres: the database, ${name}-${stage}, so sealeye-*-dev, in the
              # foundation's subnet group, with the platform keeping its master password
              # (a secret named rds!db-..., which the platform makes and tags on the
              # caller's behalf).
              - Sid: Databases
                Effect: Allow
                Action:
                  - rds:CreateDBInstance
                  - rds:DeleteDBInstance
                  - rds:ModifyDBInstance
                  - rds:AddTagsToResource
                  - rds:RemoveTagsFromResource
                  - rds:ListTagsForResource
                Resource:
                  - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:sealeye-*-dev"
                  - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:subgrp:platform-sealeye-databases"
                  - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:pg:default*"
                  - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:og:default*"
              # The provider waits for a database by listing them (db:*, not one name):
              # the first build, Oct 21, 2026, made the database and then could not see it.
              - Sid: DatabasesRead
                Effect: Allow
                Action: [rds:DescribeDBInstances, rds:DescribeDBSubnetGroups, rds:DescribeDBParameterGroups, rds:DescribeOptionGroups, rds:DescribeDBEngineVersions, rds:DescribeOrderableDBInstanceOptions]
                Resource: "*"
              # Making a database whose master password the platform keeps: RDS describes
              # the default keys (aws/rds for the disk, aws/secretsmanager for the
              # password) as the caller, so the role may read a key's description,
              # which holds no secret and grants no use of the key (RDS user guide,
              # "Permissions required for Secrets Manager integration"; the first
              # build, Oct 21, 2026: "The specified KMS key [null] ... isn't
              # accessible").
              - Sid: KeysDescribed
                Effect: Allow
                Action: kms:DescribeKey
                Resource: "*"
              - Sid: MasterPasswords
                Effect: Allow
                Action: [secretsmanager:CreateSecret, secretsmanager:TagResource, secretsmanager:DescribeSecret, secretsmanager:DeleteSecret, secretsmanager:RotateSecret]
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*"
              # postgres: the security group of its own that its one-time setup function
              # connects from, in the foundation network, with its two rules. Made only
              # with the environment's tag on it (the provider's default tags), tagged
              # only as it is made, and changed or deleted only while it carries that
              # tag: so no group seaLeye did not make (the pilot server's, a default
              # group, the platform's) can be changed.
              - Sid: SetupGroupsCreate
                Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                Condition:
                  "Null":
                    aws:RequestTag/sealeye:environment: "false"
              - Sid: SetupGroupsInTheNetwork
                Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
              - Sid: SetupGroupsTagOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group-rule/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: [CreateSecurityGroup, AuthorizeSecurityGroupIngress, AuthorizeSecurityGroupEgress]
              - Sid: SetupGroupsChange
                Effect: Allow
                Action:
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:ModifySecurityGroupRules
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                Condition:
                  "Null":
                    aws:ResourceTag/sealeye:environment: "false"
              # A function in the private network leaves its network interfaces behind,
              # detached, for a while after it is deleted, and the provider deletes them
              # before it deletes the group they use (the first database's tear-down, Oct
              # 21, 2026: "deleting ENIs using Security Group ... not authorized to
              # perform: ec2:DeleteNetworkInterface"). EC2 deletes only a detached
              # interface; the role cannot detach one (no ec2:DetachNetworkInterface), so
              # nothing in use, the pilot server's own among them, can be removed this way.
              - Sid: LeftoverInterfaces
                Effect: Allow
                Action: ec2:DeleteNetworkInterface
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
              # A rule is named by its own id beside its group's; the group's tag above
              # is what decides.
              - Sid: SetupGroupRules
                Effect: Allow
                Action: [ec2:AuthorizeSecurityGroupIngress, ec2:AuthorizeSecurityGroupEgress, ec2:RevokeSecurityGroupIngress, ec2:RevokeSecurityGroupEgress, ec2:ModifySecurityGroupRules]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group-rule/*"
              # Never a group one of the platform's own stacks made, whatever its tags
              # say: CloudFormation sets this tag and nobody can edit it.
              - Sid: KeepThePlatformsGroups
                Effect: Deny
                Action:
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:ModifySecurityGroupRules
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                Condition:
                  StringLike:
                    aws:ResourceTag/aws:cloudformation:stack-name: "platform-sealeye-*"
              # static-site: the site's bucket, juniper-site-${name}-${stage}, so a name
              # with sealeye- in it that ends -dev. Never the platform's own bucket, whose
              # name does not end -dev. Files uploaded, and emptied before a tear-down.
              - Sid: SiteBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:Get*
                  - s3:List*
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketOwnershipControls
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketVersioning
                Resource: "arn:aws:s3:::*sealeye-*-dev"
              - Sid: SiteFiles
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject, s3:ListBucket]
                Resource: "arn:aws:s3:::*sealeye-*-dev/*"
              # static-site: the content network in front of it. A distribution's ARN
              # names nothing of seaLeye's, so this reaches every distribution in the
              # account: the pilot account has none of its own. Cleared after an upload so
              # new files show at once (refreshSite in api/executor/cfn.js).
              - Sid: ContentNetwork
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateDistributionWithTags
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                Resource:
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/*"
              - Sid: ContentNetworkLists
                Effect: Allow
                Action: [cloudfront:ListDistributions, cloudfront:ListOriginAccessControls, cloudfront:GetCachePolicy]
                Resource: "*"

Outputs:
  FunctionBoundaryArn:
    Description: Set as the organization's permissions_boundary_arn platform value
    Value: !Ref FunctionBoundary
  SetupBoundaryArn:
    Description: Set as the organization's postgres.permissions_boundary_arn platform value
    Value: !Ref SetupBoundary
  TerraformRoleArn:
    Description: Store as /sealeye/SEALEYE_TERRAFORM_ROLE_ARN
    Value: !GetAtt TerraformRole.Arn
