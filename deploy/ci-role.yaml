AWSTemplateFormatVersion: "2010-09-09"
Description: >
  seaLeye CI: the role GitHub Actions takes to push the API image to ECR
  (PHASE1-PLAN Step 11). GitHub proves which repository and branch is asking, so no AWS
  keys are stored in GitHub. Stack platform-sealeye-ci.

Parameters:
  GitHubRepository:
    Type: String
    Description: owner/name of the repository whose main branch may push, e.g. you/sealeye
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      "false" if this account already trusts GitHub (an IAM identity provider for
      token.actions.githubusercontent.com exists); an account can have only one.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  ImageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: platform-sealeye-ci-image
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # This repository's main branch, and nothing else: not a pull request,
                # not another branch, not a fork.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:ref:refs/heads/main"
      Policies:
        - PolicyName: push-the-api-image
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushOnlyTheApiImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/sealeye-api"

Outputs:
  ImageRoleArn:
    Description: Set as the repository variable SEALEYE_CI_ROLE_ARN
    Value: !GetAtt ImageRole.Arn
