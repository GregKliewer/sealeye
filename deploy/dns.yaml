AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DNS for seaLeye in Route 53 (PHASE1-PLAN Step 12, D6): the hosted zone for one of
  seaLeye's domains, with records pointing the domain, www and (for sealeye.online) api at
  the pilot server. Deploy as platform-sealeye-dns-<domain with dashes>, then point the domain's
  nameservers at the NameServers output, at its registrar. deploy/README.md has the steps.

Parameters:
  DomainName:
    Type: String
    Default: sealeye.online
    AllowedPattern: "[a-z0-9.-]+"
  ApiAddress:
    Description: The PublicIp output of platform-sealeye-server. Leave empty for a domain with no API record.
    Type: String
    Default: ""
  SiteAddress:
    Description: >-
      The PublicIp output of platform-sealeye-server, for the domain itself and www (the
      server's Caddy serves or redirects each of seaLeye's domains). Leave empty for none.
    Type: String
    Default: ""
  GitHubPages:
    Description: >-
      "true" for a domain served by GitHub Pages rather than the pilot server (sealeye.org):
      the domain gets GitHub's four addresses and www a CNAME to GitHub, and SiteAddress
      is ignored.
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  HasApi: !Not [!Equals [!Ref ApiAddress, ""]]
  IsPages: !Equals [!Ref GitHubPages, "true"]
  HasSite: !And [!Not [!Equals [!Ref SiteAddress, ""]], !Not [!Condition IsPages]]

Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: seaLeye, managed by CloudFormation

  ApiRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApi
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Sub "api.${DomainName}"
      Type: A
      TTL: "300"
      ResourceRecords:
        - !Ref ApiAddress

  SiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasSite
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: A
      TTL: "300"
      ResourceRecords:
        - !Ref SiteAddress

  WwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasSite
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Sub "www.${DomainName}"
      Type: A
      TTL: "300"
      ResourceRecords:
        - !Ref SiteAddress

  PagesRecord:
    Type: AWS::Route53::RecordSet
    Condition: IsPages
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: A
      TTL: "300"
      ResourceRecords:
        - 185.199.108.153
        - 185.199.109.153
        - 185.199.110.153
        - 185.199.111.153

  PagesWwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: IsPages
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Sub "www.${DomainName}"
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - gregkliewer.github.io

Outputs:
  NameServers:
    Description: Set these four as the domain's nameservers at its registrar
    Value: !Join [" ", !GetAtt Zone.NameServers]
  HostedZoneId:
    Value: !Ref Zone
