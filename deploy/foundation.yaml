AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The network the made-up organization's modules are built into (PHASE4-PLAN Step 9):
  what Juniper Mutual's platform team would have already. Deploy as
  platform-sealeye-foundation, then set each output as one of the organization's
  platform values (deploy/README.md). Two private subnets in two data centres, subnet
  groups and security groups for databases and caches, a topic for alarms, and the
  free private endpoints for tables and buckets. No NAT gateway and no paid endpoint, so
  it costs nothing while nothing is built in it; the paid endpoints are
  platform-sealeye-endpoints (endpoints.yaml), which park removes.

# Q23 (Greg, Oct 20, 2026): private endpoints, never a NAT gateway, so an app inside the
# network still reaches its table and bucket. A module that needs the internet from
# inside it (a container pulling its image) waits until a way out is added.

Parameters:
  CidrBlock:
    Description: The network's address range
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: "^\\d+\\.\\d+\\.\\d+\\.\\d+/16$"

Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref CidrBlock
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: platform-sealeye-foundation }]

  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref CidrBlock, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: platform-sealeye-private-a }]

  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref CidrBlock, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: platform-sealeye-private-b }]

  # One route table for the private subnets, so the free endpoints below have a table to
  # put their routes in. Nothing leaves the network through it.
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Network
      Tags: [{ Key: Name, Value: platform-sealeye-private }]

  PrivateRoutesA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateA
      RouteTableId: !Ref PrivateRoutes

  PrivateRoutesB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateB
      RouteTableId: !Ref PrivateRoutes

  # Free: an app inside the network reaches its table and bucket through these, and
  # the state and packages the platform keeps in its bucket.
  TableEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Network
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      RouteTableIds: [!Ref PrivateRoutes]

  BucketEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Network
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: [!Ref PrivateRoutes]

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: platform-sealeye-databases
      DBSubnetGroupDescription: Where the organization's databases go
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]

  CacheSubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: platform-sealeye-caches
      Description: Where the organization's caches go
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]

  # Apps reach databases and caches from inside the network only.
  AppsGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: seaLeye apps inside the network
      VpcId: !Ref Network
      Tags: [{ Key: Name, Value: platform-sealeye-apps }]

  DatabasesGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: seaLeye databases, reached by apps only
      VpcId: !Ref Network
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppsGroup }
      Tags: [{ Key: Name, Value: platform-sealeye-databases }]

  CachesGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: seaLeye caches, reached by apps only
      VpcId: !Ref Network
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref AppsGroup }
      Tags: [{ Key: Name, Value: platform-sealeye-caches }]

  Alarms:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: platform-sealeye-alarms

# The exports are what endpoints.yaml reads, so park and unpark can make the paid
# endpoints with no values typed in.
Outputs:
  VpcId:
    Description: platform value vpc_id
    Value: !Ref Network
    Export: { Name: platform-sealeye-foundation-VpcId }
  CidrBlock:
    Description: The network's address range, for the endpoints' security group
    Value: !Ref CidrBlock
    Export: { Name: platform-sealeye-foundation-CidrBlock }
  PrivateSubnetA:
    Description: The first private subnet, where the paid endpoints go
    Value: !Ref PrivateA
    Export: { Name: platform-sealeye-foundation-PrivateSubnetA }
  SubnetIds:
    Description: platform value subnet_ids (a list of two), for apps that join the network
    Value: !Join [" ", [!Ref PrivateA, !Ref PrivateB]]
  DatabaseSubnetGroup:
    Description: platform values postgres.subnet_group_name and postgres_cluster.subnet_group_name
    Value: !Ref DatabaseSubnets
  CacheSubnetGroup:
    Description: platform values cache_valkey.subnet_group_name and cache_redis.subnet_group_name
    Value: !Ref CacheSubnets
  AppsSecurityGroup:
    Description: platform value security_group_ids, for apps that join the network (http_api beside a database, container_service, internal_entry)
    Value: !Ref AppsGroup
  DatabasesSecurityGroup:
    Description: platform values postgres.security_group_ids and postgres_cluster.security_group_ids
    Value: !Ref DatabasesGroup
  CachesSecurityGroup:
    Description: platform values cache_valkey.security_group_ids and cache_redis.security_group_ids
    Value: !Ref CachesGroup
  AlarmTopicArn:
    Description: platform value alarm_topic_arn
    Value: !Ref Alarms
